  .brand{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:22px;border-bottom:1px solid var(--line);padding-bottom:16px}.brand-name{font-family:'Source Serif 4',serif;font-weight:700;font-size:30px}.brand-sub{color:var(--ink-soft);font-size:12px;margin-top:2px}.brand-left{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.tabs{display:flex;gap:4px}.tabs button{background:none;border:1px solid transparent;padding:7px 10px;border-radius:6px;color:var(--ink-soft);cursor:pointer}.tabs button.active{background:var(--paper-raised);border-color:var(--line);color:var(--ink);font-weight:600}.who{display:flex;align-items:center;gap:10px}.who .name{font-weight:600}.row{display:flex;gap:16px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:16px}.card{background:var(--paper-raised);border:1px solid var(--line);border-radius:10px;padding:18px}.card h3{font-family:'Source Serif 4',serif;margin:0 0 12px;font-size:17px}.hint{color:var(--ink-soft);font-size:12px}.date-picker{display:flex;align-items:center;gap:8px}.date-picker input{font-family:'IBM Plex Mono';border:1px solid var(--line);background:var(--paper-raised);padding:7px 9px;border-radius:6px}.linklike{background:none;border:0;padding:0;color:var(--teal);cursor:pointer}.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px;margin-bottom:18px}.tile{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:12px;cursor:pointer;text-align:left}.tile.income{border-left:4px solid var(--teal)}.tile.expense{border-left:4px solid var(--rust)}.tile:hover{transform:translateY(-1px)}.tile:disabled{opacity:.55;cursor:not-allowed;transform:none}.tile .tname{font-size:13.5px;font-weight:500;display:block}.tile .ttoday{font-family:'IBM Plex Mono';font-size:12px;color:var(--ink-soft);margin-top:4px;display:block}.summary-line{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line-soft)}.summary-line:last-child{border-bottom:none}.summary-line .amt{font-family:'IBM Plex Mono';font-weight:600}.summary-line.net{font-size:16px;margin-top:4px;padding-top:12px;border-top:1px solid var(--line);border-bottom:none}.pos{color:var(--teal)}.neg{color:var(--rust)}.warning{background:var(--rust-bg);border:1px solid #dfb9aa;border-radius:8px;padding:10px;color:var(--rust);font-size:12px}.info{background:var(--teal-bg);border:1px solid #bfd5cd;border-radius:8px;padding:10px;color:var(--teal);font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--ink-soft);font-weight:500;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}td{padding:7px 8px;border-bottom:1px solid var(--line-soft);vertical-align:top}td.amt,th.amt{font-family:'IBM Plex Mono';text-align:right;white-space:nowrap}tr.income-row td.amt{color:var(--teal)}tr.expense-row td.amt{color:var(--rust)}.del-btn{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:12px}.del-btn:hover{color:var(--rust)}.muted-row td{color:var(--ink-soft);font-style:italic}.field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px}.field input,.field select{font-family:'IBM Plex Mono';border:1px solid var(--line);background:var(--paper);padding:8px 10px;border-radius:6px;font-size:14px;width:100%}.btn{background:var(--ink);color:var(--paper-raised);border:none;padding:9px 18px;border-radius:7px;font-size:13.5px;cursor:pointer}.btn:hover{opacity:.88}.btn.secondary{background:none;border:1px solid var(--line);color:var(--ink)}.btn.danger{background:var(--rust)}.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px}.badge.ok{background:var(--teal-bg);color:var(--teal)}.badge.mismatch{background:var(--rust-bg);color:var(--rust)}.badge.closed{background:var(--gold-bg);color:var(--gold)}.badge.role-admin{background:var(--gold-bg);color:var(--gold)}.badge.role-staff{background:var(--teal-bg);color:var(--teal)}
  .modal-backdrop{position:fixed;inset:0;background:rgba(32,42,46,.35);display:flex;align-items:center;justify-content:center;z-index:50}.modal{background:var(--paper-raised);border-radius:12px;padding:24px;width:360px;max-width:calc(100vw - 30px);border:1px solid var(--line)}.modal h4{font-family:'Source Serif 4',serif;margin:0 0 14px;font-size:17px}.modal .field{margin-bottom:14px}.modal-actions{display:flex;justify-content:flex-end;gap:8px}.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.filters select,.filters input{font-family:Inter;border:1px solid var(--line);background:var(--paper);padding:7px 10px;border-radius:6px;font-size:13px}.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}.kpi{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:13px}.kpi .label{font-size:11px;color:var(--ink-soft)}.kpi .value{font-family:'IBM Plex Mono';font-weight:600;font-size:18px;margin-top:4px}.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}.bar-label{width:150px;font-size:12.5px;flex-shrink:0}.bar-track{flex:1;background:var(--line-soft);border-radius:4px;height:14px;overflow:hidden}.bar-fill{height:100%;border-radius:4px}.bar-fill.income{background:var(--teal)}.bar-fill.expense{background:var(--rust)}.bar-amt{width:100px;text-align:right;font-family:'IBM Plex Mono';font-size:12.5px;flex-shrink:0}.settings-list{display:flex;flex-direction:column;gap:8px}.settings-item{display:flex;align-items:center;gap:8px}.settings-item input[type=text]{flex:1;font-family:Inter;border:1px solid var(--line);background:var(--paper);padding:6px 10px;border-radius:6px}.icon-btn{background:none;border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;color:var(--ink-soft);white-space:nowrap}.icon-btn:hover{color:var(--rust);border-color:var(--rust)}.add-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.loading{color:var(--ink-soft);padding:30px 0;text-align:center;font-size:13.5px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper-raised);padding:9px 18px;border-radius:8px;font-size:13px;z-index:100}.toast.err{background:var(--rust)}.disclosure{font-size:11.5px;color:var(--ink-soft);margin-top:18px;text-align:center}.login-wrap{max-width:360px;margin:80px auto}.login-card{background:var(--paper-raised);border:1px solid var(--line);border-radius:12px;padding:32px}.login-card .field{margin-bottom:16px}.login-title{font-family:'Source Serif 4',serif;font-size:26px;margin-bottom:4px}@media(max-width:850px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.brand-left{display:block}.brand-sub{margin-top:3px}}@media(max-width:600px){#app{padding:18px 12px 45px}.kpi-grid{grid-template-columns:1fr}.card{padding:14px}table{font-size:12px;display:block;overflow-x:auto}.bar-label{width:100px}.tabs button{padding:6px 7px}}
.report-card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0 16px}.report-card{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:16px;text-align:left;cursor:pointer;transition:.15s;min-height:132px}.report-card:hover{transform:translateY(-2px);border-color:var(--teal)}.report-card.revenue{border-top:4px solid var(--teal)}.report-card.expense{border-top:4px solid var(--rust)}.report-card.patients{border-top:4px solid var(--gold)}.report-card-top{display:flex;justify-content:space-between;color:var(--ink-soft);font-size:12px;font-weight:600}.report-card-arrow{font-size:18px;color:var(--teal)}.report-card-value{font-family:'IBM Plex Mono';font-size:25px;font-weight:600;margin-top:12px}.report-card-compare{font-size:12px;margin-top:6px;color:var(--ink-soft)}.report-card-compare.up{color:var(--teal)}.report-card-compare.down{color:var(--rust)}.report-card-hint{font-size:11px;color:var(--ink-soft);margin-top:8px}.report-panel{margin-bottom:16px}.panel-switch{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.panel-switch button{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:7px 10px;cursor:pointer;color:var(--ink-soft)}.panel-switch button.active{background:var(--ink);color:var(--paper-raised)}.report-analysis{padding:18px}.report-analysis-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.report-analysis-head h3{margin:0 0 4px}.report-section{margin-top:22px}.section-title-row{display:flex;justify-content:space-between}.chart-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink-soft);margin:8px 0 12px}.legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--teal);margin-right:5px}.legend-dot.expense{background:var(--rust)}.legend-dot.patients{background:var(--gold)}.legend-dot.xray{background:var(--gold)}.legend-dot.ultrasound{background:var(--teal)}.daily-chart{height:230px;display:flex;align-items:flex-end;gap:5px;overflow-x:auto;border-top:1px solid var(--line-soft);padding:12px 6px 0}.daily-col{min-width:30px;height:205px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.daily-bars{height:180px;display:flex;align-items:flex-end;gap:2px;width:100%}.daily-bar{width:8px;min-height:2px;background:var(--teal);border-radius:3px 3px 0 0}.daily-bar.xray{background:var(--gold)}.daily-bar.ultrasound{background:var(--teal)}.daily-bar.expense{background:var(--rust)}.daily-bar.patients{background:var(--gold)}.daily-label{font-size:9px;color:var(--ink-soft);margin-top:5px}.trend-switch{display:flex;gap:6px;margin:8px 0 14px}.trend-switch button{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:7px 10px;cursor:pointer;color:var(--ink-soft)}.trend-switch button.active{background:var(--ink);color:var(--paper-raised)}.trend-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.trend-card{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:14px}.trend-card h4{margin:0 0 10px;font-size:13px}.trend-chart{height:180px;display:flex;align-items:flex-end;gap:10px}.trend-col{height:160px;flex:1;min-width:40px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.trend-value{font-family:'IBM Plex Mono';font-size:9px;color:var(--ink-soft);white-space:nowrap;margin-bottom:4px}.trend-track{height:115px;width:100%;max-width:42px;background:var(--line-soft);border-radius:5px;display:flex;align-items:flex-end;overflow:hidden}.trend-fill{width:100%;border-radius:5px 5px 0 0;background:var(--teal)}.trend-fill.expense{background:var(--rust)}.trend-fill.patients{background:var(--gold)}.trend-label{font-size:10px;color:var(--ink-soft);margin-top:5px}@media(max-width:800px){.report-card-grid,.trend-grid{grid-template-columns:1fr}.kpi-grid{grid-template-columns:repeat(2,1fr)}}</style>

<body><div id="app"><div class="loading">Loading…</div></div>
<script>
const OTHER_VAL='__other__';
function money(n){return 'Rs '+Number(n||0).toLocaleString('en-PK')}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toYMD(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function todayStr(){return toYMD(new Date())} function monthKeyOf(s){return s.slice(0,7)} function yearKeyOf(s){return s.slice(0,4)}
function fmtDate(s){return new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}
function fmtMonthLabel(mk){const [y,m]=mk.split('-');return new Date(+y,+m-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'})}
const state={token:localStorage.getItem('labbrain_token')||localStorage.getItem('roznamcha_token')||null,user:null,view:'today',locations:[],selectedLocation:'all',categories:[],employees:[],vendors:[],doctors:[],staff:[],currentDate:todayStr(),entriesCache:{},handover:null,online:0,modal:null,toast:null,reportMonth:monthKeyOf(todayStr()),reportLocation:'all',reportUser:'all',reportTrend:'month',todayUser:'all',patientCount:0,loading:true,loginError:null};
async function api(path,method,body){const headers={'Content-Type':'application/json'};if(state.token)headers.Authorization='Bearer '+state.token;const res=await fetch(path,{method:method||'GET',headers,body:body?JSON.stringify(body):undefined});if(res.status===401){doLogout(false);throw new Error('Session expired — please log in again.')}const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'Something went wrong');return data}
function showToast(msg,isErr){state.toast={msg,isErr};render();setTimeout(()=>{state.toast=null;render()},2500)}
async function tryResume(){if(!state.token)return false;try{state.user=(await api('/api/me')).user;return true}catch(e){state.token=null;localStorage.removeItem('labbrain_token');localStorage.removeItem('roznamcha_token');return false}}
window.doLogin=async function(){const username=document.getElementById('loginUser').value.trim(),password=document.getElementById('loginPass').value;try{const d=await api('/api/login','POST',{username,password});state.token=d.token;state.user=d.user;localStorage.setItem('labbrain_token',state.token);localStorage.removeItem('roznamcha_token');state.loading=true;render();await loadEverything()}catch(e){state.loginError=e.message;render()}}
function doLogout(r=true){state.token=null;state.user=null;localStorage.removeItem('labbrain_token');localStorage.removeItem('roznamcha_token');if(r)render()} window.logout=()=>doLogout();
async function loadConfig(){const c=await api('/api/config');state.locations=c.locations||[];state.categories=c.categories||[];state.employees=c.employees||[];state.vendors=c.vendors||[];state.doctors=c.doctors||[];state.staff=c.staff||[];if(state.user.role!=='admin')state.selectedLocation=state.user.locationId||'all'}
function locationName(id){const l=state.locations.find(x=>x.id===id);return l?l.name:'—'}
function activeCategories(){return state.categories.filter(c=>(c.locationId||'nmdc-main')===state.selectedLocation)}
async function loadMonth(mk,username,locationId){let q='';if(state.user.role==='admin'&&username&&username!=='all')q+='&username='+encodeURIComponent(username);if(state.user.role==='admin'&&locationId&&locationId!=='all')q+='&locationId='+encodeURIComponent(locationId);state.entriesCache[mk]=(await api('/api/entries?month='+mk+q)).entries;return state.entriesCache[mk]}
async function loadDayData(date){await loadMonth(monthKeyOf(date),state.user.role==='admin'?(state.todayUser||'all'):state.user.username,state.user.role==='admin'?state.selectedLocation:undefined);if(state.user.role!=='admin'){state.handover=(await api('/api/handover?date='+date)).handover;state.online=(await api('/api/online?date='+date)).amount||0;state.patientCount=(await api('/api/patients?date='+date)).count||0}else{state.handover=null;state.online=0;state.patientCount=(await api('/api/patients?date='+date+'&username='+encodeURIComponent(state.todayUser||'all')+'&locationId='+encodeURIComponent(state.selectedLocation||'all'))).count||0}}
async function loadEverything(){await loadConfig();await loadDayData(state.currentDate);state.loading=false;render()}
function catById(id){return state.categories.find(c=>c.id===id)||{id,name:id,type:'expense',linkedList:'none',locationId:'nmdc-main'}}
function listForCategory(c){if(c.linkedList==='employees')return state.employees;if(c.linkedList==='vendors')return state.vendors;if(c.linkedList==='doctors')return state.doctors;return []}
function summarize(entries){let income=0,expense=0;const byCat={};entries.forEach(e=>{const c=catById(e.catId);byCat[e.catId]=byCat[e.catId]||{name:c.name,type:c.type,total:0};byCat[e.catId].total+=Number(e.amount||0);if(c.type==='income')income+=Number(e.amount||0);else expense+=Number(e.amount||0)});return{income,expense,byCat}}
function render(){const app=document.getElementById('app');if(!state.token||!state.user){app.innerHTML=renderLogin();return}if(state.loading){app.innerHTML='<div class="loading">Loading Lab-Brain…</div>';return}app.innerHTML=renderBrand()+(state.view==='today'?renderToday():state.view==='reports'?renderReports():renderSettings())+(state.modal?renderModal():'')+(state.toast?`<div class="toast ${state.toast.isErr?'err':''}">${escapeHtml(state.toast.msg)}</div>`:'')+'<div class="disclosure">Lab-Brain — secure server-side records. Existing records are preserved during normal updates.</div>'}
function renderLogin(){return `<div class="login-wrap"><div class="login-card"><div class="login-title">Lab-Brain</div><div class="hint" style="margin-bottom:20px;">Daily cash management — log in to continue</div><div class="field"><label>Username</label><input type="text" id="loginUser" onkeydown="if(event.key==='Enter')doLogin()"></div><div class="field"><label>Password</label><input type="password" id="loginPass" onkeydown="if(event.key==='Enter')doLogin()"></div>${state.loginError?`<div class="warning" style="margin-bottom:12px;">${escapeHtml(state.loginError)}</div>`:''}<button class="btn" style="width:100%;" onclick="doLogin()">Log in</button></div></div>`}
function renderBrand(){const loc=state.user.role==='admin'?(state.selectedLocation==='all'?'All locations':locationName(state.selectedLocation)):locationName(state.user.locationId);return `<div class="brand"><div class="brand-left"><div class="brand-name">Lab-Brain</div><div class="brand-sub">Daily cash management · ${escapeHtml(loc)}</div></div><div class="row" style="align-items:center;gap:14px"><nav class="tabs"><button class="${state.view==='today'?'active':''}" onclick="setView('today')">Today</button><button class="${state.view==='reports'?'active':''}" onclick="setView('reports')">Reports</button><button class="${state.view==='settings'?'active':''}" onclick="setView('settings')">Settings</button></nav><div class="who"><div><div class="name">${escapeHtml(state.user.name)}</div><span class="badge role-${state.user.role}">${state.user.role==='admin'?'Admin':'Staff'}</span></div><button class="linklike" onclick="logout()">Log out</button></div></div></div>`}
window.setView=function(v){state.view=v;render();if(v==='reports')loadReportBody()}
function renderToday(){const mk=monthKeyOf(state.currentDate),entries=(state.entriesCache[mk]||[]).filter(e=>e.date===state.currentDate&& (state.user.role==='admin'?(state.selectedLocation==='all'||e.locationId===state.selectedLocation)&&(state.todayUser==='all'||e.username===state.todayUser):e.username===state.user.username));const s=summarize(entries),closed=!!(state.handover&&state.handover.closedAt),isToday=state.currentDate===todayStr(),editable=state.user.role==='admin'||isToday, cats=state.user.role==='admin'?(state.selectedLocation==='all'?[]:activeCategories()):activeCategories(),incomeCats=cats.filter(c=>c.type==='income'),expenseCats=cats.filter(c=>c.type==='expense');
function tile(c){const t=s.byCat[c.id]?.total||0;return `<button class="tile ${c.type}" ${editable?'':'disabled'} onclick="openModal('${c.id}')"><span class="tname">${escapeHtml(c.name)}</span><span class="ttoday">${t?money(t):'—'}</span></button>`}
const rows=entries.sort((a,b)=>a.ts-b.ts).map(e=>{const c=catById(e.catId);return `<tr class="${c.type}-row"><td>${new Date(e.ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</td><td>${escapeHtml(c.name)}</td><td>${escapeHtml(e.person||'—')}</td><td class="amt">${c.type==='income'?'+':'−'} ${money(e.amount)}</td><td>${escapeHtml(e.note)}</td><td>${editable?`<button class="del-btn" onclick="removeEntry('${e.id}')">remove</button>`:''}</td></tr>`}).join('')||'<tr class="muted-row"><td colspan="6">No entries for this date.</td></tr>';
const expected=s.income-state.online-s.expense;const locPick=state.user.role==='admin'?`<select onchange="changeLocation(this.value)"><option value="all" ${state.selectedLocation==='all'?'selected':''}>All locations</option>${state.locations.map(l=>`<option value="${l.id}" ${state.selectedLocation===l.id?'selected':''}>${escapeHtml(l.name)}</option>`).join('')}</select>`:'';const usersForLocation=state.staff.filter(u=>u.role==='staff'&&(state.selectedLocation==='all'||u.locationId===state.selectedLocation));const userPick=state.user.role==='admin'?`<select onchange="changeTodayUser(this.value)"><option value="all" ${state.todayUser==='all'?'selected':''}>All Users</option>${usersForLocation.map(u=>`<option value="${escapeHtml(u.username)}" ${state.todayUser===u.username?'selected':''}>${escapeHtml(u.name)}</option>`).join('')}</select>`:'';
return `<div class="row" style="margin-bottom:16px;align-items:center"><div class="date-picker"><span class="hint">Date</span><input type="date" value="${state.currentDate}" onchange="changeDate(this.value)"><button class="linklike" onclick="changeDate('${todayStr()}')">Today</button></div>${locPick}${userPick}${state.user.role!=='admin'&&closed?'<span class="badge closed">Day closed — current date can still be corrected</span>':''}${!editable?'<span class="badge closed">Previous date — Admin correction only</span>':''}</div>
${state.user.role==='admin'&&state.selectedLocation==='all'?'<div class="info" style="margin-bottom:16px">Select a location to view its daily categories. Admin can review all locations here and in Reports.</div>':''}

window.changeLocation=async function(v){state.selectedLocation=v;state.todayUser='all';state.entriesCache={};await loadDayData(state.currentDate);render()};window.changeDate=async function(v){state.currentDate=v;await loadDayData(v);render()};window.changeTodayUser=async function(v){state.todayUser=v;state.entriesCache={};await loadDayData(state.currentDate);render()};window.savePatientCount=async function(){const el=document.getElementById('patientCountInput');const count=Math.max(0,Math.round(Number(el?.value||0)));try{await api('/api/patients','PUT',{date:state.currentDate,count});state.patientCount=count;showToast('Patient count saved.')}catch(e){showToast(e.message,true)}};window.openModal=function(id){state.modal={catId:id};render();setTimeout(()=>document.getElementById('amountInput')?.focus(),30)};window.closeModal=function(){state.modal=null;render()}
function renderModal(){const c=catById(state.modal.catId),list=listForCategory(c),has=c.linkedList&&c.linkedList!=='none',label=c.linkedList==='employees'?'Employee':c.linkedList==='vendors'?'Vendor':'Doctor';return `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><h4>${escapeHtml(c.name)} <span style="color:var(--ink-soft);font-weight:400;font-size:13px">(${c.type})</span></h4><div class="field"><label>Amount</label><input type="number" min="0" id="amountInput" placeholder="0"></div>${has?`<div class="field"><label>${label}</label><select id="personSelect" onchange="document.getElementById('personOtherWrap').style.display=this.value==='${OTHER_VAL}'?'block':'none'"><option value="">— select —</option>${list.map(n=>`<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('')}<option value="${OTHER_VAL}">Other (not in list)</option></select></div><div class="field" id="personOtherWrap" style="display:none"><label>Type ${label.toLowerCase()} name</label><input type="text" id="personOtherInput"></div>`:''}<div class="field"><label>Remarks (optional)</label><input type="text" id="noteInput" placeholder="e.g. payment detail"></div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="submitEntry()">Add</button></div></div></div>`}
window.submitEntry=async function(){const c=catById(state.modal.catId),amt=document.getElementById('amountInput').value,note=document.getElementById('noteInput').value;if(!amt||Number(amt)<=0){showToast('Enter an amount first.',true);return}let person='';if(c.linkedList&&c.linkedList!=='none'){const sel=document.getElementById('personSelect').value;if(sel===OTHER_VAL){person=document.getElementById('personOtherInput').value.trim();if(!person){showToast('Type a name, or pick from the list.',true);return}}else if(!sel){showToast('Please select a '+(c.linkedList==='employees'?'employee':c.linkedList==='vendors'?'vendor':'doctor')+'.',true);return}else person=sel}try{await api('/api/entries','POST',{date:state.currentDate,catId:c.id,amount:amt,note,person});await loadDayData(state.currentDate);state.modal=null;render()}catch(e){showToast(e.message,true)}}

function reportDayCount(mk){const [y,m]=mk.split('-').map(Number);return new Date(y,m,0).getDate()}
function shiftMonth(mk,delta){const [y,m]=mk.split('-').map(Number);const d=new Date(y,m-1+delta,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function currentMonthKey(){return monthKeyOf(todayStr())}
function lastCompletedMonths(n){const cur=currentMonthKey();const out=[];for(let i=n;i>=1;i--)out.push(shiftMonth(cur,-i));return out}
function samePeriodDates(mk){if(mk!==currentMonthKey())return {from:mk+'-01',to:mk+'-'+String(reportDayCount(mk)).padStart(2,'0')};const day=Number(todayStr().slice(8,10));return {from:mk+'-01',to:mk+'-'+String(day).padStart(2,'0')}}
function reportMonthRange(months){return {from:months[0]+'-01',to:months[months.length-1]+'-'+String(reportDayCount(months[months.length-1])).padStart(2,'0')}}
function renderTrendChart(months,totals,key,format){if(!months.length)return '<div class="hint">No completed months available yet.</div>';const max=Math.max(1,...totals);return `<div class="trend-chart">${months.map((m,i)=>`<div class="trend-col"><div class="trend-value">${format==='count'?Number(totals[i]||0):money(totals[i]||0)}</div><div class="trend-track"><div class="trend-fill ${key}" style="height:${Math.max(3,(Number(totals[i]||0)/max)*100)}%"></div></div><div class="trend-label">${new Date(m+'-01T00:00:00').toLocaleDateString('en-GB',{month:'short'})}</div></div>`).join('')}</div>`}
function renderDailyChart(rows,type){if(!rows.length)return '<div class="hint">No daily data available.</div>';const max=Math.max(1,...rows.flatMap(r=>type==='revenue'?[r.lab,r.xray,r.ultrasound]:[r.value]));const series=type==='revenue'?[['lab','Lab','income'],['xray','X-Ray','xray'],['ultrasound','Ultrasound','ultrasound']]:[['value',type==='expense'?'Cash Counter Expenses':'Patients',type]];return `<div class="chart-legend">${series.map(x=>`<span><i class="legend-dot ${x[2]}"></i>${x[1]}</span>`).join('')}</div><div class="daily-chart">${rows.map(r=>`<div class="daily-col"><div class="daily-bars">${series.map(x=>`<div class="daily-bar ${x[2]}" style="height:${Math.max(2,(Number(r[x[0]]||0)/max)*100)}%" title="${escapeHtml(x[1])}: ${type==='patients'?Number(r[x[0]]||0):money(r[x[0]]||0)}"></div>`).join('')}</div><div class="daily-label">${escapeHtml(r.label)}</div></div>`).join('')}</div>`}
function reportCard(cls,title,value,comparison,action){return `<button class="report-card ${cls}" onclick="${action}"><div class="report-card-top"><span>${title}</span><span class="report-card-arrow">→</span></div><div class="report-card-value">${value}</div><div class="report-card-compare ${comparison&&comparison.startsWith('+')?'up':comparison&&comparison.startsWith('-')?'down':''}">${comparison||'No previous period comparison'}</div><div class="report-card-hint">Click to view analysis</div></button>`}
function renderReports(){const branchUsers=state.staff.filter(u=>u.role==='staff'&&(state.reportLocation==='all'||u.locationId===state.reportLocation));if(state.reportUser!=='all'&&!branchUsers.some(u=>u.username===state.reportUser))state.reportUser='all';return `<div class="card"><div class="filters"><strong style="margin-right:4px">Management Report</strong><input type="month" value="${state.reportMonth}" onchange="setReportMonth(this.value)">${state.user.role==='admin'?`<select onchange="setReportLocation(this.value)"><option value="all" ${state.reportLocation==='all'?'selected':''}>All locations</option>${state.locations.map(l=>`<option value="${l.id}" ${state.reportLocation===l.id?'selected':''}>${escapeHtml(l.name)}</option>`).join('')}</select><select onchange="setReportUser(this.value)"><option value="all" ${state.reportUser==='all'?'selected':''}>All Users</option>${branchUsers.map(u=>`<option value="${escapeHtml(u.username)}" ${state.reportUser===u.username?'selected':''}>${escapeHtml(u.name)}</option>`).join('')}</select>`:''}</div><div id="reportBody" class="loading">Crunching numbers…</div></div>`}
async function loadReportBody(){const el=document.getElementById('reportBody');if(!el)return;try{el.innerHTML='<div class="loading">Crunching numbers…</div>';const period=samePeriodDates(state.reportMonth);const six=lastCompletedMonths(6);const range=reportMonthRange(six);const q1=new URLSearchParams({from:period.from,to:period.to,locationId:state.reportLocation,username:state.reportUser});const q2=new URLSearchParams({from:range.from,to:range.to,locationId:state.reportLocation,username:state.reportUser});const [current,trend]=await Promise.all([api('/api/management-summary?'+q1.toString()),api('/api/management-summary?'+q2.toString())]);const s=summarize(current.entries),online=sumDailyRows(current.online,'amount'),short=sumDailyRows(current.handovers,'cashShort'),excess=sumDailyRows(current.handovers,'excessCash');const patientsCurrent=sumDailyRows(current.patients,'count');const expected=s.income-online-s.expense;const previousMonth=shiftMonth(state.reportMonth,-1);const prevDates=state.reportMonth===currentMonthKey()?samePeriodDates(previousMonth):{from:previousMonth+'-01',to:previousMonth+'-'+String(reportDayCount(previousMonth)).padStart(2,'0')};const qPrev=new URLSearchParams({from:prevDates.from,to:prevDates.to,locationId:state.reportLocation,username:state.reportUser});const prev=await api('/api/management-summary?'+qPrev.toString());const prevRev=sumDailyRows(prev.entries.filter(e=>catById(e.catId).type==='income'),'amount');const prevExp=sumDailyRows(prev.entries.filter(e=>catById(e.catId).type==='expense'),'amount');const prevPatients=sumDailyRows(prev.patients,'count');const pct=(a,b)=>b?((a-b)/b*100):null;const revPct=pct(s.income,prevRev),expPct=pct(s.expense,prevExp),patPct=pct(patientsCurrent,prevPatients);const revCmp=revPct==null?'':`${revPct>=0?'+':''}${revPct.toFixed(1)}% vs previous period`;const expCmp=expPct==null?'':`${expPct>=0?'+':''}${expPct.toFixed(1)}% vs previous period`;const patCmp=patPct==null?'':`${patPct>=0?'+':''}${patPct.toFixed(1)}% vs previous period`;
const dailyMap={};current.entries.forEach(e=>{const c=catById(e.catId);dailyMap[e.date]=dailyMap[e.date]||{date:e.date,lab:0,xray:0,ultrasound:0,expense:0};const n=Number(e.amount||0);if(c.type==='income'){const name=c.name.toLowerCase();if(name.includes('labor'))dailyMap[e.date].lab+=n;else if(name.includes('xray')||name.includes('x-ray'))dailyMap[e.date].xray+=n;else if(name.includes('ultrasound'))dailyMap[e.date].ultrasound+=n}else dailyMap[e.date].expense+=n});const patientMap={};current.patients.forEach(p=>{patientMap[p.date]=(patientMap[p.date]||0)+Number(p.count||0)});const dates=Object.keys({...dailyMap,...patientMap}).sort();const dailyRows=dates.map(d=>({label:new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit'}),date:d,lab:dailyMap[d]?.lab||0,xray:dailyMap[d]?.xray||0,ultrasound:dailyMap[d]?.ultrasound||0,value:patientMap[d]||0,expense:dailyMap[d]?.expense||0}));const completedTrend=state.reportTrend==='3'?lastCompletedMonths(3):lastCompletedMonths(6);const trendFrom=completedTrend[0]+'-01',trendTo=completedTrend[completedTrend.length-1]+'-'+String(reportDayCount(completedTrend[completedTrend.length-1])).padStart(2,'0');const qt=new URLSearchParams({from:trendFrom,to:trendTo,locationId:state.reportLocation,username:state.reportUser});const td=completedTrend.length===six.length?trend:await api('/api/management-summary?'+qt.toString());const monthAgg={};completedTrend.forEach(m=>monthAgg[m]={revenue:0,expense:0,patients:0});td.entries.forEach(e=>{const m=e.date.slice(0,7);if(!monthAgg[m])return;const c=catById(e.catId);monthAgg[m][c.type==='income'?'revenue':'expense']+=Number(e.amount||0)});td.patients.forEach(p=>{const m=p.date.slice(0,7);if(monthAgg[m])monthAgg[m].patients+=Number(p.count||0)});
const byLoc={};current.entries.forEach(e=>{const id=e.locationId||'nmdc-main';byLoc[id]=byLoc[id]||{income:0,expense:0};const c=catById(e.catId);byLoc[id][c.type==='income'?'income':'expense']+=Number(e.amount||0)});const locRows=Object.entries(byLoc).sort((a,b)=>(b[1].income-b[1].expense)-(a[1].income-a[1].expense)).map(([id,x])=>`<tr><td>${escapeHtml(locationName(id))}</td><td class="amt pos">${money(x.income)}</td><td class="amt neg">${money(x.expense)}</td><td class="amt">${money(x.income-x.expense)}</td></tr>`).join('')||'<tr class="muted-row"><td colspan="4">No location data.</td></tr>';const staff={};current.entries.forEach(e=>{staff[e.username]=staff[e.username]||{name:e.name,income:0,expense:0,locationId:e.locationId,patients:0};const c=catById(e.catId);staff[e.username][c.type==='income'?'income':'expense']+=Number(e.amount||0)});current.patients.forEach(p=>{if(staff[p.username])staff[p.username].patients+=Number(p.count||0)});const staffRows=Object.values(staff).sort((a,b)=>(b.income-b.expense)-(a.income-a.expense)).map(x=>`<tr><td>${escapeHtml(x.name)}</td><td>${escapeHtml(locationName(x.locationId))}</td><td class="amt pos">${money(x.income)}</td><td class="amt neg">${money(x.expense)}</td><td class="amt">${money(x.income-x.expense)}</td><td class="amt">${Number(x.patients||0)}</td></tr>`).join('')||'<tr class="muted-row"><td colspan="6">No staff data.</td></tr>';const handRows=current.handovers.sort((a,b)=>a.date.localeCompare(b.date)).map(h=>`<tr><td>${fmtDate(h.date)}</td><td>${escapeHtml(h.username)}</td><td>${escapeHtml(locationName(h.locationId))}</td><td class="amt">${money(h.calculated)}</td><td class="amt neg">${money(h.cashShort)}</td><td class="amt pos">${money(h.excessCash)}</td><td>${escapeHtml(h.remark||'')}</td></tr>`).join('')||'<tr class="muted-row"><td colspan="7">No handover records.</td></tr>';
const revByCat={};const expByCat={};current.entries.forEach(e=>{const c=catById(e.catId);(c.type==='income'?revByCat:expByCat)[c.name]=((c.type==='income'?revByCat:expByCat)[c.name]||0)+Number(e.amount||0)});const catBars=(obj,cls)=>Object.entries(obj).sort((a,b)=>b[1]-a[1]).map(([name,v])=>`<div class="bar-row"><div class="bar-label">${escapeHtml(name)}</div><div class="bar-track"><div class="bar-fill ${cls}" style="width:${(v/Math.max(1,...Object.values(obj))*100).toFixed(1)}%"></div></div><div class="bar-amt">${money(v)}</div></div>`).join('')||'<div class="hint">No entries in this period.</div>';
const trendNames=completedTrend.map(m=>new Date(m+'-01T00:00:00').toLocaleDateString('en-GB',{month:'short'}));const revTrend=completedTrend.map(m=>monthAgg[m].revenue),expTrend=completedTrend.map(m=>monthAgg[m].expense),patTrend=completedTrend.map(m=>monthAgg[m].patients);el.innerHTML=`<div class="report-heading"><div><h3>${fmtMonthLabel(state.reportMonth)}</h3><div class="hint">${state.reportLocation==='all'?'All locations':escapeHtml(locationName(state.reportLocation))} · ${state.reportUser==='all'?'All Users':escapeHtml((state.staff.find(u=>u.username===state.reportUser)||{}).name||state.reportUser)}</div></div></div><div class="report-card-grid">${reportCard('revenue','Revenue',money(s.income),revCmp,"toggleReportPanel('revenue')")}${reportCard('expense','Cash Counter Expenses',money(s.expense),expCmp,"toggleReportPanel('expense')")}${reportCard('patients','Patient Count',Number(patientsCurrent).toLocaleString('en-PK'),patCmp,"toggleReportPanel('patients')")}</div><div id="reportPanel" class="report-panel"></div><div class="kpi-grid"><div class="kpi"><div class="label">Online</div><div class="value">${money(online)}</div></div><div class="kpi"><div class="label">Expected Cash</div><div class="value">${money(expected)}</div></div><div class="kpi"><div class="label">Cash Short</div><div class="value neg">${money(short)}</div></div><div class="kpi"><div class="label">Excess Cash</div><div class="value pos">${money(excess)}</div></div><div class="kpi"><div class="label">Net Cash Mismatch</div><div class="value ${short||excess?'neg':''}">${money(short-excess)}</div></div></div><div class="report-section"><div class="section-title-row"><div class="group-label">Revenue by category</div></div>${catBars(revByCat,'income')}</div><div class="report-section"><div class="section-title-row"><div class="group-label">Cash Counter Expenses by category</div></div>${catBars(expByCat,'expense')}</div><div class="report-section"><div class="group-label">Location performance</div><table><thead><tr><th>Location</th><th class="amt">Revenue</th><th class="amt">Cash Expenses</th><th class="amt">Balance</th></tr></thead><tbody>${locRows}</tbody></table></div>${state.user.role==='admin'?`<div class="report-section"><div class="group-label">Staff performance</div><table><thead><tr><th>Staff</th><th>Location</th><th class="amt">Revenue</th><th class="amt">Cash Expenses</th><th class="amt">Balance</th><th class="amt">Patients</th></tr></thead><tbody>${staffRows}</tbody></table></div>`:''}<div class="report-section"><div class="group-label">Cash mismatch / handover history</div><table><thead><tr><th>Date</th><th>Staff</th><th>Location</th><th class="amt">Expected</th><th class="amt">Short</th><th class="amt">Excess</th><th>Remarks</th></tr></thead><tbody>${handRows}</tbody></table></div><div class="report-section"><div class="group-label">Completed-month trends</div><div class="trend-switch"><button class="${state.reportTrend==='3'?'active':''}" onclick="setReportTrend('3')">Last 3 Months</button><button class="${state.reportTrend==='6'?'active':''}" onclick="setReportTrend('6')">Last 6 Months</button></div><div class="trend-grid"><div class="trend-card"><h4>Revenue trend</h4>${renderTrendChart(trendNames,revTrend,'revenue','money')}</div><div class="trend-card"><h4>Cash Counter Expense trend</h4>${renderTrendChart(trendNames,expTrend,'expense','money')}</div><div class="trend-card"><h4>Patient count trend</h4>${renderTrendChart(trendNames,patTrend,'patients','count')}</div></div></div>`;
window.toggleReportPanel=async function(type){const panel=document.getElementById('reportPanel');if(!panel)return;if(panel.dataset.type===type){panel.innerHTML='';panel.dataset.type='';return}panel.dataset.type=type;let title='',body='';if(type==='revenue'){title='Revenue Analysis';body=renderDailyChart(dailyRows,'revenue')}else if(type==='expense'){title='Cash Counter Expense Analysis';body=renderDailyChart(dailyRows,'expense')}else{title='Patient Count Analysis';body=renderDailyChart(dailyRows,'patients')}panel.innerHTML=`<div class="card report-analysis"><div class="report-analysis-head"><div><h3>${title}</h3><div class="hint">Daily view for ${fmtMonthLabel(state.reportMonth)}. Current month shows month-to-date.</div></div><button class="btn secondary" onclick="toggleReportPanel('${type}')">Close</button></div><div class="panel-switch"><button class="active" onclick="showReportPanelDaily('${type}')">Daily</button><button onclick="showReportPanelTrend('${type}',3)">Last 3 Completed Months</button><button onclick="showReportPanelTrend('${type}',6)">Last 6 Completed Months</button></div><div id="reportPanelContent">${body}</div></div>`};window.showReportPanelDaily=function(type){const c=document.getElementById('reportPanelContent');if(!c)return;c.innerHTML=type==='revenue'?renderDailyChart(dailyRows,'revenue'):type==='expense'?renderDailyChart(dailyRows,'expense'):renderDailyChart(dailyRows,'patients')};window.showReportPanelTrend=function(type,n){const c=document.getElementById('reportPanelContent');if(!c)return;const months=lastCompletedMonths(n),from=months[0]+'-01',to=months[months.length-1]+'-'+String(reportDayCount(months[months.length-1])).padStart(2,'0');api('/api/management-summary?'+new URLSearchParams({from,to,locationId:state.reportLocation,username:state.reportUser}).toString()).then(d=>{const agg={};months.forEach(m=>agg[m]={revenue:0,expense:0,patients:0});d.entries.forEach(e=>{const m=e.date.slice(0,7),c=catById(e.catId);if(agg[m])agg[m][c.type==='in }catch(e){el.innerHTML=`<div class="warning">${escapeHtml(e.message)}</div>`}}
window.setReportMonth=function(v){state.reportMonth=v;render();loadReportBody()};window.setReportLocation=function(v){state.reportLocation=v;state.reportUser='all';render();loadReportBody()};window.setReportUser=function(v){state.reportUser=v;render();loadReportBody()};window.setReportTrend=function(v){state.reportTrend=v;loadReportBody()};
function renderSettings(){const a=state.user.role==='admin';const loc=state.selectedLocation==='all'?((state.locations[0]||{}).id||'nmdc-main'):state.selectedLocation;const cats=state.categories.filter(c=>(c.locationId||'nmdc-main')===loc);const catRows=cats.map(c=>{const i=state.categories.indexOf(c);return `<div class="settings-item"><input type="text" value="${escapeHtml(c.name)}" onchange="renameCategory(${i},this.value)"><select onchange="setCategoryType(${i},this.value)"><option value="income" ${c.type==='income'?'selected':''}>Income</option><option value="expense" ${c.type==='expense'?'selected':''}>Expense</option></select><select onchange="setCategoryLinkedList(${i},this.value)"><option value="none" ${c.linkedList==='none'?'selected':''}>No list</option><option value="employees" ${c.linkedList==='employees'?'selected':''}>Employees list</option><option value="vendors" ${c.linkedList==='vendors'?'selected':''}>Vendors list</option><option value="doctors" ${c.linkedList==='doctors'?'selected':''}>Doctors list</option></select><button class="icon-btn" onclick="removeCategory(${i})">Remove</button></div>`}).join('');const empRows=state.employees.map((e,i)=>`<div class="settings-item"><input type="text" value="${escapeHtml(e)}" onchange="renameEmployee(${i},this.value)"><button class="icon-btn" onclick="removeEmployee(${i})">Remove</button></div>`).join('')||'<div class="hint">No employees added.</div>';const vendRows=state.vendors.map((v,i)=>`<div class="settings-item"><input type="text" value="${escapeHtml(v)}" onchange="renameVendor(${i},this.value)"><button class="icon-btn" onclick="removeVendor(${i})">Remove</button></div>`).join('')||'<div class="hint">No vendors added.</div>';const docRows=state.doctors.map((v,i)=>`<div class="settings-item"><input type="text" value="${escapeHtml(v)}" onchange="renameDoctor(${i},this.value)"><button class="icon-btn" onclick="removeDoctor(${i})">Remove</button></div>`).join('')||'<div class="hint">No doctors added.</div>';const userRows=state.staff.map(u=>`<div class="settings-item"><span style="flex:1"><strong>${escapeHtml(u.name)}</strong> <span class="hint">(${escapeHtml(u.username)})</span></span><select onchange="setUserRole('${u.id}',this.value)"><option value="staff" ${u.role==='staff'?'selected':''}>Staff</option><option value="admin" ${u.role==='admin'?'selected':''}>Admin</option></select>${u.role==='staff'?`<select onchange="setUserLocation('${u.id}',this.value)"><option value="">Select location</option>${state.locations.map(l=>`<option value="${l.id}" ${u.locationId===l.id?'selected':''}>${escapeHtml(l.name)}</option>`).join('')}</select>`:'<span class="badge role-admin">All locations</span>'}<button class="icon-btn" onclick="resetUserPassword('${u.id}')">Reset password</button>${u.id!==state.user.id&&u.id!=='admin'?`<button class="icon-btn" onclick="removeUser('${u.id}')">Remove</button>`:''}</div>`).join('');if(!a)return `<div class="card"><h3>My account</h3><div class="hint">Location: ${escapeHtml(locationName(state.user.locationId))}</div>${passwordCard()}</div>`;return `<div class="row"><div class="col" style="flex:2;min-width:420px"><div class="card"><h3>Locations</h3><div class="settings-list">${state.locations.map((l,i)=>`<div class="settings-item"><input type="text" value="${escapeHtml(l.name)}" onchange="renameLocation(${i},this.value)"></div>`).join('')}</div></div><div class="card"><h3>Categories</h3><div class="field" style="max-width:430px;margin-bottom:12px"><label>Choose location</label><select onchange="setSettingsLocation(this.value)">${state.locations.map(l=>`<option value="${l.id}" ${loc===l.id?'selected':''}>${escapeHtml(l.name)}</option>`).join('')}</select></div><div class="hint" style="margin-bottom:10px">Categories are location-specific. Only linked categories use a person dropdown + Other.</div><div class="settings-list">${catRows}</div><div class="add-row"><input type="text" id="newCatName" placeholder="New category name" style="flex:1"><select id="newCatType"><option value="income">Income</option><option value="expense">Expense</option></select><button class="btn secondary" onclick="addCategory()">Add</button></div></div><div class="card"><h3>Staff & Owner accounts</h3><div class="settings-list">${userRows}</div><div class="add-row"><input type="text" id="newStaffName" placeholder="Full name"><input type="text" id="newStaffUser" placeholder="Username"><input type="text" id="newStaffPass" placeholder="Password"><select id="newStaffRole"><option value="staff">Staff</option><option value="admin">Admin / Owner</option></select><select id="newStaffLocation"><option value="">Staff location</option>${state.locations.map(l=>`<option value="${l.id}">${escapeHtml(l.name)}</option>`).join('')}</select><button class="btn secondary" onclick="addStaff()">Add</button></div></div>${passwordCard()}</div><div class="col" style="min-width:260px"><div class="card"><h3>Employees list</h3><div class="settings-list">${empRows}</div><div class="add-row"><input type="text" id="newEmpName" placeholder="Employee name" style="flex:1"><button class="btn secondary" onclick="addEmployee()">Add</button></div></div><div class="card"><h3>Doctors list</h3><div class="settings-list">${docRows}</div><div class="add-row"><input type="text" id="newDocName" placeholder="Doctor name" style="flex:1"><button class="btn secondary" onclick="addDoctor()">Add</button></div></div><div class="card"><h3>Vendors list</h3><div class="settings-list">${vendRows}</div><div class="add-row"><input type="text" id="newVendName" placeholder="Vendor name" style="flex:1"><button class="btn secondary" onclick="addVendor()">Add</button></div></div></div></div>`}
function passwordCard(){return `<div class="card"><h3>Change my password</h3><div class="field" style="margin-bottom:10px"><label>Current password</label><input type="password" id="oldPass"></div><div class="field" style="margin-bottom:10px"><label>New password</label><input type="password" id="newPass"></div><button class="btn secondary" onclick="changeMyPassword()">Update password</button></div>`}
async function cfgPut(endpoint,key,val){try{await api(endpoint,'PUT',{[key]:val});await loadConfig();render()}catch(e){showToast(e.message,true)}}
window.setSettingsLocation=v=>{state.selectedLocation=v;render()};window.renameLocation=(i,v)=>{state.locations[i].name=v;cfgPut('/api/config/locations','locations',state.locations)};window.renameCategory=(i,v)=>{state.categories[i].name=v;cfgPut('/api/config/categories','categories',state.categories)};window.setCategoryType=(i,v)=>{state.categories[i].type=v;cfgPut('/api/config/categories','categories',state.categories)};window.setCategoryLinkedList=(i,v)=>{state.categories[i].linkedList=v;cfgPut('/api/config/categories','categories',state.categories)};window.removeCategory=i=>{state.categories.splice(i,1);cfgPut('/api/config/categories','categories',state.categories)};window.addCategory=()=>{const n=document.getElementById('newCatName').value.trim(),t=document.getElementById('newCatType').value,loc=state.selectedLocation==='all'?(state.locations[0]||{}).id:'nmdc-main';if(!n)return;state.categories.push({id:n.toLowerCase().replace(/[^a-z0-9]+/g,'_')+'_'+Math.random().toString(36).slice(2,6),name:n,type:t,linkedList:'none',locationId:loc});cfgPut('/api/config/categories','categories',state.categories)};
window.renameEmployee=(i,v)=>{state.employees[i]=v;cfgPut('/api/config/employees','employees',state.employees)};window.removeEmployee=i=>{state.employees.splice(i,1);cfgPut('/api/config/employees','employees',state.employees)};window.addEmployee=()=>{const n=document.getElementById('newEmpName').value.trim();if(n){state.employees.push(n);cfgPut('/api/config/employees','employees',state.employees)}};window.renameVendor=(i,v)=>{state.vendors[i]=v;cfgPut('/api/config/vendors','vendors',state.vendors)};window.removeVendor=i=>{state.vendors.splice(i,1);cfgPut('/api/config/vendors','vendors',state.vendors)};window.addVendor=()=>{const n=document.getElementById('newVendName').value.trim();if(n){state.vendors.push(n);cfgPut('/api/config/vendors','vendors',state.vendors)}};window.renameDoctor=(i,v)=>{state.doctors[i]=v;cfgPut('/api/config/doctors','doctors',state.doctors)};window.removeDoctor=i=>{state.doctors.splice(i,1);cfgPut('/api/config/doctors','doctors',state.doctors)};window.addDoctor=()=>{const n=document.getElementById('newDocName').value.trim();if(n){state.doctors.push(n);cfgPut('/api/config/doctors','doctors',state.doctors)}};
window.addStaff=async function(){const name=document.getElementById('newStaffName').value.trim(),username=document.getElementById('newStaffUser').value.trim(),password=document.getElementById('newStaffPass').value,role=document.getElementById('newStaffRole').value,locationId=document.getElementById('newStaffLocation').value;if(!name||!username||!password){showToast('Fill name, username and password.',true);return}if(role==='staff'&&!locationId){showToast('Select a location for Staff.',true);return}try{await api('/api/users','POST',{name,username,password,role,locationId});await loadConfig();render();showToast('Account created.')}catch(e){showToast(e.message,true)}};window.setUserRole=async(id,role)=>{try{await api('/api/users/'+id,'PUT',{role});await loadConfig();render()}catch(e){showToast(e.message,true)}};window.setUserLocation=async(id,locationId)=>{try{await api('/api/users/'+id,'PUT',{locationId});await loadConfig();render()}catch(e){showToast(e.message,true)}};window.resetUserPassword=async id=>{const pw=prompt('New password for this account:');if(!pw)return;try{await api('/api/users/'+id,'PUT',{password:pw});showToast('Password updated.')}catch(e){showToast(e.message,true)}};window.removeUser=async id=>{if(!confirm('Remove this account? Past entries stay in records.'))return;try{await api('/api/users/'+id,'DELETE');await loadConfig();render()}catch(e){showToast(e.message,true)}};window.changeMyPassword=async()=>{const oldPassword=document.getElementById('oldPass').value,newPassword=document.getElementById('newPass').value;try{await api('/api/change-password','POST',{oldPassword,newPassword});showToast('Password updated.');document.getElementById('oldPass').value='';document.getElementById('newPass').value=''}catch(e){showToast(e.message,true)}};
(async()=>{const ok=await tryResume();if(ok)await loadEverything();else{state.loading=false;render()}})();
</script></body></html>
