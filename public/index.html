<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab-Brain — Daily Cash Management</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');
  :root{--paper:#EFE9DE;--paper-raised:#F7F4EC;--ink:#202A2E;--ink-soft:#5B6660;--teal:#2F6F62;--teal-bg:#E3EDE8;--rust:#A84E36;--rust-bg:#F3E5DE;--gold:#A87C1F;--gold-bg:#F1E6CD;--line:#D3C9B4;--line-soft:#E2DACB;}
  *{box-sizing:border-box} html,body{margin:0;padding:0} body{background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45} #app{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
  .brand{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:22px;border-bottom:1px solid var(--line);padding-bottom:16px}.brand-name{font-family:'Source Serif 4',serif;font-weight:700;font-size:30px}.brand-sub{color:var(--ink-soft);font-size:12px;margin-top:2px}.brand-left{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.tabs{display:flex;gap:4px}.tabs button{background:none;border:1px solid transparent;padding:7px 10px;border-radius:6px;color:var(--ink-soft);cursor:pointer}.tabs button.active{background:var(--paper-raised);border-color:var(--line);color:var(--ink);font-weight:600}.who{display:flex;align-items:center;gap:10px}.who .name{font-weight:600}.row{display:flex;gap:16px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:16px}.card{background:var(--paper-raised);border:1px solid var(--line);border-radius:10px;padding:18px}.card h3{font-family:'Source Serif 4',serif;margin:0 0 12px;font-size:17px}.hint{color:var(--ink-soft);font-size:12px}.date-picker{display:flex;align-items:center;gap:8px}.date-picker input{font-family:'IBM Plex Mono';border:1px solid var(--line);background:var(--paper-raised);padding:7px 9px;border-radius:6px}.linklike{background:none;border:0;padding:0;color:var(--teal);cursor:pointer}.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px;margin-bottom:18px}.tile{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:12px;cursor:pointer;text-align:left}.tile.income{border-left:4px solid var(--teal)}.tile.expense{border-left:4px solid var(--rust)}.tile:hover{transform:translateY(-1px)}.tile:disabled{opacity:.55;cursor:not-allowed;transform:none}.tile .tname{font-size:13.5px;font-weight:500;display:block}.tile .ttoday{font-family:'IBM Plex Mono';font-size:12px;color:var(--ink-soft);margin-top:4px;display:block}.summary-line{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line-soft)}.summary-line:last-child{border-bottom:none}.summary-line .amt{font-family:'IBM Plex Mono';font-weight:600}.summary-line.net{font-size:16px;margin-top:4px;padding-top:12px;border-top:1px solid var(--line);border-bottom:none}.pos{color:var(--teal)}.neg{color:var(--rust)}.warning{background:var(--rust-bg);border:1px solid #dfb9aa;border-radius:8px;padding:10px;color:var(--rust);font-size:12px}.info{background:var(--teal-bg);border:1px solid #bfd5cd;border-radius:8px;padding:10px;color:var(--teal);font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--ink-soft);font-weight:500;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}td{padding:7px 8px;border-bottom:1px solid var(--line-soft);vertical-align:top}td.amt,th.amt{font-family:'IBM Plex Mono';text-align:right;white-space:nowrap}tr.income-row td.amt{color:var(--teal)}tr.expense-row td.amt{color:var(--rust)}.del-btn{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:12px}.del-btn:hover{color:var(--rust)}.muted-row td{color:var(--ink-soft);font-style:italic}.field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px}.field input,.field select{font-family:'IBM Plex Mono';border:1px solid var(--line);background:var(--paper);padding:8px 10px;border-radius:6px;font-size:14px;width:100%}.btn{background:var(--ink);color:var(--paper-raised);border:none;padding:9px 18px;border-radius:7px;font-size:13.5px;cursor:pointer}.btn:hover{opacity:.88}.btn.secondary{background:none;border:1px solid var(--line);color:var(--ink)}.btn.danger{background:var(--rust)}.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px}.badge.ok{background:var(--teal-bg);color:var(--teal)}.badge.mismatch{background:var(--rust-bg);color:var(--rust)}.badge.closed{background:var(--gold-bg);color:var(--gold)}.badge.role-admin{background:var(--gold-bg);color:var(--gold)}.badge.role-staff{background:var(--teal-bg);color:var(--teal)}
  .modal-backdrop{position:fixed;inset:0;background:rgba(32,42,46,.35);display:flex;align-items:center;justify-content:center;z-index:50}.modal{background:var(--paper-raised);border-radius:12px;padding:24px;width:360px;max-width:calc(100vw - 30px);border:1px solid var(--line)}.modal h4{font-family:'Source Serif 4',serif;margin:0 0 14px;font-size:17px}.modal .field{margin-bottom:14px}.modal-actions{display:flex;justify-content:flex-end;gap:8px}.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.filters select,.filters input{font-family:Inter;border:1px solid var(--line);background:var(--paper);padding:7px 10px;border-radius:6px;font-size:13px}.report-cards{grid-template-columns:repeat(3,1fr)}.report-card{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:18px;text-align:left;cursor:pointer;min-height:140px}.report-card:hover{transform:translateY(-2px);border-color:var(--teal)}.report-card .rc-label{font-size:12px;color:var(--ink-soft)}.report-card .rc-value{font-family:'IBM Plex Mono';font-size:24px;font-weight:600;margin-top:8px}.report-card .rc-change{font-size:12px;margin-top:8px}.report-card .rc-change.up{color:var(--teal)}.report-card .rc-change.down{color:var(--rust)}.report-card .rc-hint{font-size:11px;color:var(--ink-soft);margin-top:8px}.analysis{margin-top:16px}.analysis-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.vbars{height:230px;display:flex;align-items:flex-end;gap:5px;padding:12px 4px 0;overflow-x:auto;border-bottom:1px solid var(--line)}.vbar-wrap{height:100%;min-width:22px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}.vbar{width:18px;background:var(--teal);border-radius:4px 4px 0 0;min-height:3px}.vbar-label{font-size:9px;color:var(--ink-soft)}.vbars.small{height:170px}.trend-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}@media(max-width:850px){.report-cards{grid-template-columns:1fr}.vbars{gap:3px}}.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}.kpi{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:13px}.kpi .label{font-size:11px;color:var(--ink-soft)}.kpi .value{font-family:'IBM Plex Mono';font-weight:600;font-size:18px;margin-top:4px}.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}.bar-label{width:150px;font-size:12.5px;flex-shrink:0}.bar-track{flex:1;background:var(--line-soft);border-radius:4px;height:14px;overflow:hidden}.bar-fill{height:100%;border-radius:4px}.bar-fill.income{background:var(--teal)}.bar-fill.expense{background:var(--rust)}.bar-amt{width:100px;text-align:right;font-family:'IBM Plex Mono';font-size:12.5px;flex-shrink:0}.settings-list{display:flex;flex-direction:column;gap:8px}.settings-item{display:flex;align-items:center;gap:8px}.settings-item input[type=text]{flex:1;font-family:Inter;border:1px solid var(--line);background:var(--paper);padding:6px 10px;border-radius:6px}.icon-btn{background:none;border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;color:var(--ink-soft);white-space:nowrap}.icon-btn:hover{color:var(--rust);border-color:var(--rust)}.add-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.loading{color:var(--ink-soft);padding:30px 0;text-align:center;font-size:13.5px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper-raised);padding:9px 18px;border-radius:8px;font-size:13px;z-index:100}.toast.err{background:var(--rust)}.disclosure{font-size:11.5px;color:var(--ink-soft);margin-top:18px;text-align:center}.login-wrap{max-width:360px;margin:80px auto}.login-card{background:var(--paper-raised);border:1px solid var(--line);border-radius:12px;padding:32px}.login-card .field{margin-bottom:16px}.login-title{font-family:'Source Serif 4',serif;font-size:26px;margin-bottom:4px}@media(max-width:850px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.brand-left{display:block}.brand-sub{margin-top:3px}}@media(max-width:600px){#app{padding:18px 12px 45px}.kpi-grid{grid-template-columns:1fr}.card{padding:14px}table{font-size:12px;display:block;overflow-x:auto}.bar-label{width:100px}.tabs button{padding:6px 7px}}
@media print{body{background:white}#app{max-width:none;padding:10px}.brand,.tabs,.who,.filters .no-print,.disclosure,.icon-btn,.trend-actions{display:none!important}.card{border:0;box-shadow:none}.analysis{break-inside:avoid}.report-cards{grid-template-columns:repeat(3,1fr)}table{font-size:10px}}
</style>
</head>
<body><div id="app"><div class="loading">Loading…</div></div>
<script>
const OTHER_VAL='__other__';
function money(n){return 'Rs '+Number(n||0).toLocaleString('en-PK')}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toYMD(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function todayStr(){return toYMD(new Date())} function monthKeyOf(s){return s.slice(0,7)} function yearKeyOf(s){return s.slice(0,4)}
function fmtDate(s){return new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}
function fmtMonthLabel(mk){const [y,m]=mk.split('-');return new Date(+y,+m-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'})}
const state={token:localStorage.getItem('labbrain_token')||localStorage.getItem('roznamcha_token')||null,user:null,view:'today',locations:[],selectedLocation:'all',selectedUser:'all',categories:[],employees:[],vendors:[],doctors:[],staff:[],currentDate:todayStr(),entriesCache:{},handover:null,online:0,modal:null,toast:null,reportMonth:monthKeyOf(todayStr()),reportLocation:'all',reportUser:'all',reportPanel:'overview',patientCount:0,loading:true,loginError:null};
async function api(path,method,body){const headers={'Content-Type':'application/json'};if(state.token)headers.Authorization='Bearer '+state.token;const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),15000);try{const res=await fetch(path,{method:method||'GET',headers,body:body?JSON.stringify(body):undefined,signal:controller.signal});if(res.status===401){doLogout(false);throw new Error('Session expired — please log in again.')}const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'Something went wrong');return data}catch(e){if(e.name==='AbortError')throw new Error('Server did not respond. Please refresh and try again.');throw e}finally{clearTimeout(timer)}}
function showToast(msg,isErr){state.toast={msg,isErr};render();setTimeout(()=>{state.toast=null;render()},2500)}
async function tryResume(){if(!state.token)return false;try{state.user=(await api('/api/me')).user;return true}catch(e){state.token=null;localStorage.removeItem('labbrain_token');localStorage.removeItem('roznamcha_token');return false}}
window.doLogin=async function(){const username=document.getElementById('loginUser').value.trim(),password=document.getElementById('loginPass').value;try{const d=await api('/api/login','POST',{username,password});state.token=d.token;state.user=d.user;localStorage.setItem('labbrain_token',state.token);localStorage.removeItem('roznamcha_token');state.loading=true;render();await loadEverything()}catch(e){state.loginError=e.message;render()}}
function doLogout(r=true){state.token=null;state.user=null;localStorage.removeItem('labbrain_token');localStorage.removeItem('roznamcha_token');if(r)render()} window.logout=()=>doLogout();
async function loadConfig(){const c=await api('/api/config');state.locations=c.locations||[];state.categories=c.categories||[];state.employees=c.employees||[];state.vendors=c.vendors||[];state.doctors=c.doctors||[];state.staff=c.staff||[];if(state.user.role!=='admin')state.selectedLocation=state.user.locationId||'all'}
function locationName(id){const l=state.locations.find(x=>x.id===id);return l?l.name:'—'}
function activeCategories(){return state.categories.filter(c=>(c.locationId||'nmdc-main')===state.selectedLocation)}
async function loadMonth(mk,username,locationId){let q='';if(state.user.role==='admin'&&username&&username!=='all')q+='&username='+encodeURIComponent(username);if(state.user.role==='admin'&&locationId&&locationId!=='all')q+='&locationId='+encodeURIComponent(locationId);state.entriesCache[mk]=(await api('/api/entries?month='+mk+q)).entries;return state.entriesCache[mk]}
async function loadDayData(date){
  const username=state.user.role==='admin'?state.selectedUser:state.user.username;
  await loadMonth(monthKeyOf(date),username,state.user.role==='admin'?state.selectedLocation:undefined);
  if(state.user.role!=='admin'){state.handover=(await api('/api/handover?date='+date)).handover;state.online=(await api('/api/online?date='+date)).amount||0;state.patientCount=(await api('/api/patients?date='+date)).count||0}
  else {state.handover=null;state.online=0;
    const users=state.staff.filter(u=>u.role==='staff'&&(!state.selectedLocation||state.selectedLocation==='all'||u.locationId===state.selectedLocation));
    if(username&&username!=='all') state.patientCount=(await api('/api/patients?date='+date+'&username='+encodeURIComponent(username))).count||0;
    else { const vals=await Promise.all(users.map(u=>api('/api/patients?date='+date+'&username='+encodeURIComponent(u.username)).then(x=>Number(x.count||0)))); state.patientCount=vals.reduce((a,b)=>a+b,0); }
  }
}
async function loadEverything(){await loadConfig();await loadDayData(state.currentDate);state.loading=false;render()}
function catById(id){return state.categories.find(c=>c.id===id)||{id,name:id,type:'expense',linkedList:'none',locationId:'nmdc-main'}}
function listForCategory(c){if(c.linkedList==='employees')return state.employees;if(c.linkedList==='vendors')return state.vendors;if(c.linkedList==='doctors')return state.doctors;return []}
function summarize(entries){let income=0,expense=0;const byCat={};entries.forEach(e=>{const c=catById(e.catId);byCat[e.catId]=byCat[e.catId]||{name:c.name,type:c.type,total:0};byCat[e.catId].total+=Number(e.amount||0);if(c.type==='income')income+=Number(e.amount||0);else expense+=Number(e.amount||0)});return{income,expense,byCat}}
function render(){const app=document.getElementById('app');if(!state.token||!state.user){app.innerHTML=renderLogin();return}if(state.loading){app.innerHTML='<div class="loading">Loading Lab-Brain…</div>';return}app.innerHTML=renderBrand()+(state.view==='today'?renderToday():state.view==='reports'?renderReports():renderSettings())+(state.modal?renderModal():'')+(state.toast?`<div class="toast ${state.toast.isErr?'err':''}">${escapeHtml(state.toast.msg)}</div>`:'')+'<div class="disclosure">Lab-Brain — secure server-side records. Existing records are preserved during normal updates.</div>'}
function renderLogin(){return `<div class="login-wrap"><div class="login-card"><div class="login-title">Lab-Brain</div><div class="hint" style="margin-bottom:20px;">Daily cash management — log in to continue</div><div class="field"><label>Username</label><input type="text" id="loginUser" onkeydown="if(event.key==='Enter')doLogin()"></div><div class="field"><label>Password</label><input type="password" id="loginPass" onkeydown="if(event.key==='Enter')doLogin()"></div>${state.loginError?`<div class="warning" style="margin-bottom:12px;">${escapeHtml(state.loginError)}</div>`:''}<button class="btn" style="width:100%;" onclick="doLogin()">Log in</button></div></div>`}
function renderBrand(){const loc=state.user.role==='admin'?(state.selectedLocation==='all'?'All locations':locationName(state.selectedLocation)):locationName(state.user.locationId);return `<div class="brand"><div class="brand-left"><div class="brand-name">Lab-Brain</div><div class="brand-sub">Daily cash management · ${escapeHtml(loc)}</div></div><div class="row" style="align-items:center;gap:14px"><nav class="tabs"><button class="${state.view==='today'?'active':''}" onclick="setView('today')">Today</button><button class="${state.view==='reports'?'active':''}" onclick="setView('reports')">Reports</button><button class="${state.view==='settings'?'active':''}" onclick="setView('settings')">Settings</button></nav><div class="who"><div><div class="name">${escapeHtml(state.user.name)}</div><span class="badge role-${state.user.role}">${state.user.role==='admin'?'Admin':'Staff'}</span></div><button class="linklike" onclick="logout()">Log out</button></div></div></div>`}
window.setView=function(v){state.view=v;render();if(v==='reports')loadReportBody()}
function renderToday(){const mk=monthKeyOf(state.currentDate),entries=(state.entriesCache[mk]||[]).filter(e=>e.date===state.currentDate&& (state.user.role==='admin'?(state.selectedLocation==='all'||e.locationId===state.selectedLocation)&&(state.selectedUser==='all'||e.username===state.selectedUser):e.username===state.user.username));const s=summarize(entries),closed=!!(state.handover&&state.handover.closedAt),isToday=state.currentDate===todayStr(),editable=state.user.role==='admin'||isToday,cats=state.user.role==='admin'?(state.selectedLocation==='all'?[]:activeCategories()):activeCategories(),incomeCats=cats.filter(c=>c.type==='income'),expenseCats=cats.filter(c=>c.type==='expense');
function tile(c){const t=s.byCat[c.id]?.total||0;return `<button class="tile ${c.type}" ${editable?'':'disabled'} onclick="openModal('${c.id}')"><span class="tname">${escapeHtml(c.name)}</span><span class="ttoday">${t?money(t):'—'}</span></button>`}
const rows=entries.sort((a,b)=>a.ts-b.ts).map(e=>{const c=catById(e.catId);return `<tr class="${c.type}-row"><td>${new Date(e.ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</td><td>${escapeHtml(c.name)}</td><td>${escapeHtml(e.person||'—')}</td><td class="amt">${c.type==='income'?'+':'−'} ${money(e.amount)}</td><td>${escapeHtml(e.note)}</td><td>${editable?`<button class="del-btn" onclick="removeEntry('${e.id}')">remove</button>`:''}</td></tr>`}).join('')||'<tr class="muted-row"><td colspan="6">No entries for this date.</td></tr>';
const expected=s.income-state.online-s.expense;const locPick=state.user.role==='admin'?`<select onchange="changeLocation(this.value)"><option value="all" ${state.selectedLocation==='all'?'selected':''}>All locations</option>${state.locations.map(l=>`<option value="${l.id}" ${state.selectedLocation===l.id?'selected':''}>${escapeHtml(l.name)}</option>`).join('')}</select><select onchange="changeUser(this.value)"><option value="all" ${state.selectedUser==='all'?'selected':''}>All Users</option>${state.staff.filter(u=>u.role==='staff'&&(state.selectedLocation==='all'||u.locationId===state.selectedLocation)).map(u=>`<option value="${escapeHtml(u.username)}" ${state.selectedUser===u.username?'selected':''}>${escapeHtml(u.name)}</option>`).join('')}</select>`:'';
return `<div class="row" style="margin-bottom:16px;align-items:center"><div class="date-picker"><span class="hint">Date</span><input type="date" value="${state.currentDate}" onchange="changeDate(this.value)"><button class="linklike" onclick="changeDate('${todayStr()}')">Today</button></div>${locPick}${state.user.role!=='admin'&&closed?'<span class="badge closed">Day closed — current date can still be corrected</span>':''}${!editable?'<span class="badge closed">Previous date — Admin correction only</span>':''}</div>
${state.user.role==='admin'&&state.selectedLocation==='all'?'<div class="info" style="margin-bottom:16px">Select a location to view its daily categories. Admin can review all locations here and in Reports.</div>':''}
<div class="row"><div class="col" style="flex:2;min-width:340px">${state.user.role==='admin'&&state.selectedLocation==='all'?'':`<div class="card"><h3>Income — tests/services</h3><div class="tile-grid">${incomeCats.map(tile).join('')||'<span class="hint">No income categories for this location.</span>'}</div><h3>Expenses paid out</h3><div class="tile-grid">${expenseCats.map(tile).join('')||'<span class="hint">No expense categories for this location.</span>'}</div></div>`}<div class="card"><h3>${state.user.role==='admin'?'Entries':'My entries'} — ${fmtDate(state.currentDate)}</h3><table><thead><tr><th>Time</th><th>Category</th><th>Who / Vendor</th><th class="amt">Amount</th><th>Remarks</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>
<div class="col" style="min-width:290px"><div class="card"><h3>Daily summary</h3><div class="summary-line"><span>Total Revenue</span><span class="amt pos">${money(s.income)}</span></div><div class="summary-line"><span>Online</span><span class="amt">${money(state.online)}</span></div><div class="summary-line"><span>Expenses</span><span class="amt neg">${money(s.expense)}</span></div><div class="summary-line"><span>Patient Count</span><span class="amt">${Number(state.patientCount||0).toLocaleString('en-PK')}</span></div><div class="summary-line net"><span>Expected Cash</span><span class="amt">${state.user.role==='admin'&&state.selectedLocation==='all'?'—':money(expected)}</span></div>${state.user.role!=='admin'&&editable?`<div class="field" style="margin-top:14px"><label>Patient Count for today</label><input type="number" min="0" step="1" id="patientInput" value="${Number(state.patientCount||0)}" placeholder="0"></div><button class="btn secondary" style="margin-top:8px" onclick="savePatients()">Save Patient Count</button><div class="field" style="margin-top:14px"><label>Online amount for today</label><input type="number" min="0" id="onlineInput" value="${state.online}" placeholder="0"></div><button class="btn secondary" style="margin-top:8px" onclick="saveOnline()">Save Online</button><div class="hint" style="margin-top:8px">Online is already included in Total Revenue; it is only deducted from expected physical cash.</div>`:''}</div>${state.user.role!=='admin'?`<div class="card"><h3>Cash handover</h3>${renderHandover(s,expected,closed,editable)}</div>`:'<div class="card"><h3>Management</h3><div class="hint">Use Reports for consolidated revenue, cash counter expenses, patient count, locations, staff and cash mismatch history.</div></div>'}</div></div>`}
window.changeLocation=async function(v){state.selectedLocation=v;state.selectedUser='all';state.entriesCache={};await loadDayData(state.currentDate);render()}
window.changeUser=async function(v){state.selectedUser=v;state.entriesCache={};await loadDayData(state.currentDate);render()}
window.changeDate=async function(v){state.currentDate=v;await loadDayData(v);render()}
function renderHandover(s,expected,closed,editable){const h=state.handover||{};return `${closed?'<div class="badge closed" style="margin-bottom:10px">Handover saved</div>':''}<div class="summary-line"><span>Expected Cash</span><span class="amt">${money(expected)}</span></div><div class="field" style="margin-top:12px"><label>Cash Short</label><input type="number" min="0" id="shortInput" value="${Number(h.cashShort||0)}" ${editable?'':'disabled'}></div><div class="field" style="margin-top:10px"><label>Excess Cash</label><input type="number" min="0" id="excessInput" value="${Number(h.excessCash||0)}" ${editable?'':'disabled'}></div><div class="hint" style="margin:8px 0">Enter only one: Short OR Excess. System calculates actual cash as Expected − Short + Excess.</div>${h.cashShort?`<div class="warning" style="margin-bottom:10px">Cash Short: <strong>${money(h.cashShort)}</strong>${h.remark?` — ${escapeHtml(h.remark)}`:''}</div>`:''}${h.excessCash?`<div class="info" style="margin-bottom:10px">Excess Cash: <strong>${money(h.excessCash)}</strong></div>`:''}<div class="field"><label>Mismatch remarks</label><input type="text" id="mismatchRemark" value="${escapeHtml(h.remark||'')}" ${editable?'':'disabled'} placeholder="e.g. Rs 500 short, amount not found"></div>${editable?`<button class="btn" style="margin-top:12px" onclick="saveHandover()">${closed?'Update handover':'Close day & hand over'}</button>`:''}`}
window.openModal=function(id){state.modal={catId:id};render();setTimeout(()=>document.getElementById('amountInput')?.focus(),30)};window.closeModal=function(){state.modal=null;render()}
function renderModal(){const c=catById(state.modal.catId),list=listForCategory(c),has=c.linkedList&&c.linkedList!=='none',label=c.linkedList==='employees'?'Employee':c.linkedList==='vendors'?'Vendor':'Doctor';return `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><h4>${escapeHtml(c.name)} <span style="color:var(--ink-soft);font-weight:400;font-size:13px">(${c.type})</span></h4><div class="field"><label>Amount</label><input type="number" min="0" id="amountInput" placeholder="0"></div>${has?`<div class="field"><label>${label}</label><select id="personSelect" onchange="document.getElementById('personOtherWrap').style.display=this.value==='${OTHER_VAL}'?'block':'none'"><option value="">— select —</option>${list.map(n=>`<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('')}<option value="${OTHER_VAL}">Other (not in list)</option></select></div><div class="field" id="personOtherWrap" style="display:none"><label>Type ${label.toLowerCase()} name</label><input type="text" id="personOtherInput"></div>`:''}<div class="field"><label>Remarks (optional)</label><input type="text" id="noteInput" placeholder="e.g. payment detail"></div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="submitEntry()">Add</button></div></div></div>`}
window.submitEntry=async function(){const c=catById(state.modal.catId),amt=document.getElementById('amountInput').value,note=document.getElementById('noteInput').value;if(!amt||Number(amt)<=0){showToast('Enter an amount first.',true);return}let person='';if(c.linkedList&&c.linkedList!=='none'){const sel=document.getElementById('personSelect').value;if(sel===OTHER_VAL){person=document.getElementById('personOtherInput').value.trim();if(!person){showToast('Type a name, or pick from the list.',true);return}}else if(!sel){showToast('Please select a '+(c.linkedList==='employees'?'employee':c.linkedList==='vendors'?'vendor':'doctor')+'.',true);return}else person=sel}try{await api('/api/entries','POST',{date:state.currentDate,catId:c.id,amount:amt,note,person});await loadDayData(state.currentDate);state.modal=null;render()}catch(e){showToast(e.message,true)}}
window.removeEntry=async function(id){try{await api('/api/entries/'+id+'?month='+monthKeyOf(state.currentDate),'DELETE');await loadDayData(state.currentDate);render()}catch(e){showToast(e.message,true)}}
window.savePatients=async function(){const count=Number(document.getElementById('patientInput').value||0);if(count<0||!Number.isInteger(count)){showToast('Enter a valid whole patient count.',true);return}try{await api('/api/patients','PUT',{date:state.currentDate,count});await loadDayData(state.currentDate);render();showToast('Patient count saved.')}catch(e){showToast(e.message,true)}};window.saveOnline=async function(){const amount=Number(document.getElementById('onlineInput').value||0);try{await api('/api/online','PUT',{date:state.currentDate,amount});state.online=amount;render();showToast('Online amount saved.')}catch(e){showToast(e.message,true)}}
window.saveHandover=async function(){const short=Number(document.getElementById('shortInput').value||0),excess=Number(document.getElementById('excessInput').value||0),remark=document.getElementById('mismatchRemark').value.trim();if(short>0&&excess>0){showToast('Enter either Cash Short or Excess Cash, not both.',true);return}try{await api('/api/handover','POST',{date:state.currentDate,cashShort:short,excessCash:excess,remark});await loadDayData(state.currentDate);render();showToast('Handover saved.')}catch(e){showToast(e.message,true)}}
function renderReports(){return `<div class="card"><div class="filters"><strong style="margin-right:4px">Management Report</strong><input type="month" value="${state.reportMonth}" onchange="setReportMonth(this.value)">${state.user.role==='admin'?`<select onchange="setReportLocation(this.value)"><option value="all" ${state.reportLocation==='all'?'selected':''}>All locations</option>${state.locations.map(l=>`<option value="${l.id}" ${state.reportLocation===l.id?'selected':''}>${escapeHtml(l.name)}</option>`).join('')}</select><select onchange="setReportUser(this.value)"><option value="all" ${state.reportUser==='all'?'selected':''}>All staff</option>${state.staff.filter(u=>u.role==='staff'&&(state.reportLocation==='all'||u.locationId===state.reportLocation)).map(u=>`<option value="${escapeHtml(u.username)}" ${state.reportUser===u.username?'selected':''}>${escapeHtml(u.name)}</option>`).join('')}</select>`:''}<button class="btn secondary no-print" onclick="downloadReportCSV()">Excel (CSV)</button><button class="btn secondary no-print" onclick="printReport()">PDF / Print</button></div><div id="reportBody" class="loading">Loading management report…</div>${state.user.role==='admin'?`<div class="card no-print" style="margin-top:18px"><h3>Data Safety & Demo</h3><div class="hint" style="margin-bottom:10px">A downloadable backup is a complete copy of your Lab-Brain data. The system also keeps automatic snapshots before normal saves.</div><div class="row"><button class="btn secondary" onclick="downloadBackup()">Download Full Backup</button><button class="btn secondary" onclick="loadDemoData()">Load Demo Data</button><button class="btn danger" onclick="removeDemoData()">Remove Demo Data</button><button class="btn secondary" onclick="showBackups()">Backup History</button></div><div id="backupList" style="margin-top:12px"></div></div>`:''}</div>`}
window.setReportMonth=function(v){state.reportMonth=v;state.reportPanel='overview';render();loadReportBody()};window.setReportLocation=function(v){state.reportLocation=v;state.reportUser='all';state.reportPanel='overview';render();loadReportBody()};window.setReportUser=function(v){state.reportUser=v;state.reportPanel='overview';render();loadReportBody()};window.toggleReportPanel=function(v){state.reportPanel=state.reportPanel===v?'overview':v;loadReportBody()}
function monthAdd(mk,delta){const [y,m]=mk.split('-').map(Number);const d=new Date(y,m-1+delta,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function dayCountInMonth(mk){const [y,m]=mk.split('-').map(Number);return new Date(y,m,0).getDate()}
function barSeries(values,max){return values.map(v=>`<div class="vbar-wrap"><div class="vbar" style="height:${max?Math.max(3,(v.value/max)*100):3}%" title="${escapeHtml(v.label)}: ${escapeHtml(v.display)}"></div><div class="vbar-label">${escapeHtml(v.label)}</div></div>`).join('')}
async function loadReportBody(){const el=document.getElementById('reportBody');if(!el)return;el.innerHTML='<div class="loading">Loading management report…</div>';try{const from=state.reportMonth+'-01',to=state.reportMonth+'-'+String(dayCountInMonth(state.reportMonth)).padStart(2,'0');const q=new URLSearchParams({from,to,locationId:state.reportLocation,username:state.reportUser});const data=await api('/api/management-summary?'+q.toString());const s=summarize(data.entries),online=data.online.reduce((a,x)=>a+Number(x.amount||0),0),expected=s.income-online-s.expense,short=data.handovers.reduce((a,h)=>a+Number(h.cashShort||0),0),excess=data.handovers.reduce((a,h)=>a+Number(h.excessCash||0),0),patients=data.patients.reduce((a,x)=>a+Number(x.count||0),0);const prevMk=monthAdd(state.reportMonth,-1),prevTo=state.reportMonth===monthKeyOf(todayStr())?Math.min(new Date().getDate(),dayCountInMonth(prevMk)):dayCountInMonth(prevMk);const prevData=await api('/api/management-summary?'+new URLSearchParams({from:prevMk+'-01',to:prevMk+'-'+String(prevTo).padStart(2,'0'),locationId:state.reportLocation,username:state.reportUser}));const prevRev=summarize(prevData.entries).income,prevExp=summarize(prevData.entries).expense,prevPatients=prevData.patients.reduce((a,x)=>a+Number(x.count||0),0);const pct=(cur,prev)=>prev?((cur-prev)/prev*100):null;const revPct=pct(s.income,prevRev),expPct=pct(s.expense,prevExp),patPct=pct(patients,prevPatients);const cards=[['revenue','Revenue',money(s.income),revPct],['expense','Cash Counter Expenses',money(s.expense),expPct],['patients','Patient Count',patients.toLocaleString('en-PK'),patPct]];let panel='';if(state.reportPanel!=='overview'){const current=state.reportPanel==='revenue'?data.entries.filter(e=>catById(e.catId).type==='income'):state.reportPanel==='expense'?data.entries.filter(e=>catById(e.catId).type==='expense'):[];if(state.reportPanel==='patients'){const byDay={};data.patients.forEach(x=>byDay[x.date]=(byDay[x.date]||0)+Number(x.count||0));const vals=Object.keys(byDay).sort().map(d=>({value:byDay[d],label:d.slice(8),display:String(byDay[d])}));panel=`<div class="analysis card"><div class="analysis-head"><div><h3>Daily Patient Count</h3><div class="hint">${fmtMonthLabel(state.reportMonth)}</div></div><button class="icon-btn" onclick="toggleReportPanel('patients')">Close</button></div><div class="vbars">${barSeries(vals,Math.max(1,...vals.map(x=>x.value)))||'<div class="hint">No patient data.</div>'}</div><div class="trend-actions"><button class="btn secondary" onclick="showTrend('patients',3)">Last 3 Completed Months</button><button class="btn secondary" onclick="showTrend('patients',6)">Last 6 Completed Months</button></div></div>`}else{const byDay={};const byCat={};current.forEach(e=>{byDay[e.date]=(byDay[e.date]||0)+Number(e.amount||0);const c=catById(e.catId);byCat[c.name]=(byCat[c.name]||0)+Number(e.amount||0)});const vals=Object.keys(byDay).sort().map(d=>({value:byDay[d],label:d.slice(8),display:money(byDay[d])}));const catVals=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([label,value])=>({value,label,display:money(value)}));panel=`<div class="analysis card"><div class="analysis-head"><div><h3>${state.reportPanel==='revenue'?'Daily Revenue':'Daily Cash Counter Expenses'}</h3><div class="hint">${fmtMonthLabel(state.reportMonth)}</div></div><button class="icon-btn" onclick="toggleReportPanel('${state.reportPanel}')">Close</button></div><div class="vbars">${barSeries(vals,Math.max(1,...vals.map(x=>x.value)))||'<div class="hint">No data.</div>'}</div><div class="group-label" style="margin-top:18px">${state.reportPanel==='revenue'?'Revenue by category':'Expenses by category'}</div><div class="vbars small">${barSeries(catVals,Math.max(1,...catVals.map(x=>x.value)))||'<div class="hint">No data.</div>'}</div><div class="trend-actions"><button class="btn secondary" onclick="showTrend('${state.reportPanel}',3)">Last 3 Completed Months</button><button class="btn secondary" onclick="showTrend('${state.reportPanel}',6)">Last 6 Completed Months</button></div></div>`}}el.innerHTML=`<h3>${fmtMonthLabel(state.reportMonth)}</h3><div class="kpi-grid report-cards">${cards.map(([key,label,value,change])=>`<button class="report-card ${key}" onclick="toggleReportPanel('${key}')"><div class="rc-label">${label}</div><div class="rc-value">${value}</div><div class="rc-change ${change!=null?(change>=0?'up':'down'):''}">${change==null?'No previous data':(change>=0?'↑ ':'↓ ')+Math.abs(change).toFixed(1)+'% vs previous comparable period'}</div><div class="rc-hint">Click to view analysis</div></button>`).join('')}</div><div class="kpi-grid" style="margin-top:10px"><div class="kpi"><div class="label">Online</div><div class="value">${money(online)}</div></div><div class="kpi"><div class="label">Expected Cash</div><div class="value">${money(expected)}</div></div><div class="kpi"><div class="label">Cash Short</div><div class="value neg">${money(short)}</div></div><div class="kpi"><div class="label">Excess Cash</div><div class="value pos">${money(excess)}</div></div></div>${panel}<div class="group-label" style="margin-top:22px">Location performance</div><table><thead><tr><th>Location</th><th class="amt">Revenue</th><th class="amt">Cash Expenses</th><th class="amt">Patients</th></tr></thead><tbody>${locationRows(data)}</tbody></table>${state.user.role==='admin'?`<div class="group-label" style="margin-top:22px">Staff performance</div><table><thead><tr><th>Staff</th><th>Location</th><th class="amt">Revenue</th><th class="amt">Cash Expenses</th><th class="amt">Patients</th></tr></thead><tbody>${staffReportRows(data)}</tbody></table>`:''}<div class="group-label" style="margin-top:22px">Cash mismatch / handover history</div><table><thead><tr><th>Date</th><th>Staff</th><th>Location</th><th class="amt">Expected</th><th class="amt">Short</th><th class="amt">Excess</th><th>Remarks</th></tr></thead><tbody>${handoverRows(data)}</tbody></table>`}catch(e){console.error(e);el.innerHTML=`<div class="warning">Report could not be loaded. ${escapeHtml(e.message||'Please refresh and try again.')}</div>`}}
function locationRows(data){const map={};data.entries.forEach(e=>{const id=e.locationId||'nmdc-main';map[id]=map[id]||{rev:0,exp:0,patients:0};const c=catById(e.catId);map[id][c.type==='income'?'rev':'exp']+=Number(e.amount||0)});data.patients.forEach(x=>{const id=x.locationId||'nmdc-main';map[id]=map[id]||{rev:0,exp:0,patients:0};map[id].patients+=Number(x.count||0)});return Object.entries(map).map(([id,x])=>`<tr><td>${escapeHtml(locationName(id))}</td><td class="amt pos">${money(x.rev)}</td><td class="amt neg">${money(x.exp)}</td><td class="amt">${x.patients.toLocaleString('en-PK')}</td></tr>`).join('')||'<tr class="muted-row"><td colspan="4">No location data.</td></tr>'}
function staffReportRows(data){const map={};data.entries.forEach(e=>{map[e.username]=map[e.username]||{name:e.name,locationId:e.locationId,rev:0,exp:0,patients:0};const c=catById(e.catId);map[e.username][c.type==='income'?'rev':'exp']+=Number(e.amount||0)});data.patients.forEach(x=>{map[x.username]=map[x.username]||{name:x.username,locationId:x.locationId,rev:0,exp:0,patients:0};map[x.username].patients+=Number(x.count||0)});return Object.values(map).map(x=>`<tr><td>${escapeHtml(x.name)}</td><td>${escapeHtml(locationName(x.locationId))}</td><td class="amt pos">${money(x.rev)}</td><td class="amt neg">${money(x.exp)}</td><td class="amt">${x.patients.toLocaleString('en-PK')}</td></tr>`).join('')||'<tr class="muted-row"><td colspan="5">No staff data.</td></tr>'}
function handoverRows(data){return data.handovers.sort((a,b)=>a.date.localeCompare(b.date)).map(h=>`<tr><td>${fmtDate(h.date)}</td><td>${escapeHtml(h.username)}</td><td>${escapeHtml(locationName(h.locationId))}</td><td class="amt">${money(h.calculated)}</td><td class="amt neg">${money(h.cashShort)}</td><td class="amt pos">${money(h.excessCash)}</td><td>${escapeHtml(h.remark||'')}</td></tr>`).join('')||'<tr class="muted-row"><td colspan="7">No handover records.</td></tr>'}
async function downloadFile(url,filename){const headers={};if(state.token)headers.Authorization='Bearer '+state.token;const r=await fetch(url,{headers});if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||'Download failed');}const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
window.downloadReportCSV=async function(){try{const from=state.reportMonth+'-01',to=state.reportMonth+'-'+String(dayCountInMonth(state.reportMonth)).padStart(2,'0');const q=new URLSearchParams({from,to,locationId:state.reportLocation,username:state.reportUser});await downloadFile('/api/report.csv?'+q.toString(),'lab-brain-report-'+state.reportMonth+'.csv');}catch(e){showToast(e.message,true)}};
window.printReport=function(){window.print()};
window.downloadBackup=async function(){try{await downloadFile('/api/backup','lab-brain-backup-'+todayStr()+'.json');showToast('Backup downloaded.')}catch(e){showToast(e.message,true)}};
window.loadDemoData=async function(){if(!confirm('Load demo data for testing reports? It will be clearly tracked and can be removed later.'))return;try{const r=await api('/api/demo-data/load','POST',{});showToast(r.message);await loadEverything();state.view='reports';render();loadReportBody()}catch(e){showToast(e.message,true)}};
window.removeDemoData=async function(){if(!confirm('Remove ONLY the demo data previously loaded by Lab-Brain? Your real records are not targeted.'))return;try{const r=await api('/api/demo-data/remove','POST',{});showToast(r.message);await loadEverything();state.view='reports';render();loadReportBody()}catch(e){showToast(e.message,true)}};
window.showBackups=async function(){const el=document.getElementById('backupList');if(!el)return;try{const d=await api('/api/backups');if(!d.backups.length){el.innerHTML='<div class="hint">No automatic snapshots yet. A snapshot is created before the next normal data change.</div>';return}el.innerHTML='<div class="hint" style="margin-bottom:6px">Latest automatic snapshots (newest first):</div>'+d.backups.slice(0,10).map(b=>`<div class="row" style="justify-content:space-between;align-items:center;border-bottom:1px solid var(--line-soft);padding:6px 0"><span>Backup #${b.id} — ${new Date(b.created_at).toLocaleString()}</span><button class="icon-btn" onclick="restoreBackup(${b.id})">Restore</button></div>`).join('')}catch(e){el.innerHTML='<div class="warning">'+escapeHtml(e.message)+'</div>'}};
window.restoreBackup=async function(id){if(!confirm('Restore Backup #'+id+'? Your CURRENT data will first be snapshotted automatically, then this older version will become active.'))return;try{await api('/api/backups/'+id+'/restore','POST',{});localStorage.removeItem('labbrain_token');localStorage.removeItem('roznamcha_token');alert('Backup restored. Please log in again.');location.reload()}catch(e){showToast(e.message,true)}};
window.showTrend=async function(kind,n){const el=document.getElementById('reportBody');if(!el)return;try{const months=[];for(let i=n;i>=1;i--)months.push(monthAdd(state.reportMonth,-i));const rows=await Promise.all(months.map(async mk=>{const d=await api('/api/management-summary?'+new URLSearchParams({from:mk+'-01',to:mk+'-'+String(dayCountInMonth(mk)).padStart(2,'0'),locationId:state.reportLocation,username:state.reportUser}));let v=0;if(kind==='patients')v=d.patients.reduce((a,x)=>a+Number(x.count||0),0);else v=summarize(d.entries)[kind==='revenue'?'income':'expense'];return {value:v,label:mk.slice(5),display:kind==='patients'?String(v):money(v)};}));el.innerHTML=`<div class="analysis card"><div class="analysis-head"><div><h3>${kind==='revenue'?'Revenue':kind==='expense'?'Cash Counter Expenses':'Patient Count'} — Last ${n} Completed Months</h3><div class="hint">Current incomplete month is excluded.</div></div><button class="icon-btn" onclick="loadReportBody()">Back</button></div><div class="vbars">${barSeries(rows,Math.max(1,...rows.map(x=>x.value)))}</div></div>`}catch(e){el.innerHTML=`<div class="warning">Trend could not be loaded. ${escapeHtml(e.message||'Please try again.')}</div>`}}
function passwordCard(){return `<div class="card"><h3>Change my password</h3><div class="field" style="margin-bottom:10px"><label>Current password</label><input type="password" id="oldPass"></div><div class="field" style="margin-bottom:10px"><label>New password</label><input type="password" id="newPass"></div><button class="btn secondary" onclick="changeMyPassword()">Update password</button></div>`}
async function cfgPut(endpoint,key,val){try{await api(endpoint,'PUT',{[key]:val});await loadConfig();render()}catch(e){showToast(e.message,true)}}
window.setSettingsLocation=v=>{state.selectedLocation=v;render()};window.renameLocation=(i,v)=>{state.locations[i].name=v;cfgPut('/api/config/locations','locations',state.locations)};window.renameCategory=(i,v)=>{state.categories[i].name=v;cfgPut('/api/config/categories','categories',state.categories)};window.setCategoryType=(i,v)=>{state.categories[i].type=v;cfgPut('/api/config/categories','categories',state.categories)};window.setCategoryLinkedList=(i,v)=>{state.categories[i].linkedList=v;cfgPut('/api/config/categories','categories',state.categories)};window.removeCategory=i=>{state.categories.splice(i,1);cfgPut('/api/config/categories','categories',state.categories)};window.addCategory=()=>{const n=document.getElementById('newCatName').value.trim(),t=document.getElementById('newCatType').value,loc=state.selectedLocation==='all'?(state.locations[0]||{}).id:'nmdc-main';if(!n)return;state.categories.push({id:n.toLowerCase().replace(/[^a-z0-9]+/g,'_')+'_'+Math.random().toString(36).slice(2,6),name:n,type:t,linkedList:'none',locationId:loc});cfgPut('/api/config/categories','categories',state.categories)};
window.renameEmployee=(i,v)=>{state.employees[i]=v;cfgPut('/api/config/employees','employees',state.employees)};window.removeEmployee=i=>{state.employees.splice(i,1);cfgPut('/api/config/employees','employees',state.employees)};window.addEmployee=()=>{const n=document.getElementById('newEmpName').value.trim();if(n){state.employees.push(n);cfgPut('/api/config/employees','employees',state.employees)}};window.renameVendor=(i,v)=>{state.vendors[i]=v;cfgPut('/api/config/vendors','vendors',state.vendors)};window.removeVendor=i=>{state.vendors.splice(i,1);cfgPut('/api/config/vendors','vendors',state.vendors)};window.addVendor=()=>{const n=document.getElementById('newVendName').value.trim();if(n){state.vendors.push(n);cfgPut('/api/config/vendors','vendors',state.vendors)}};window.renameDoctor=(i,v)=>{state.doctors[i]=v;cfgPut('/api/config/doctors','doctors',state.doctors)};window.removeDoctor=i=>{state.doctors.splice(i,1);cfgPut('/api/config/doctors','doctors',state.doctors)};window.addDoctor=()=>{const n=document.getElementById('newDocName').value.trim();if(n){state.doctors.push(n);cfgPut('/api/config/doctors','doctors',state.doctors)}};
window.addStaff=async function(){const name=document.getElementById('newStaffName').value.trim(),username=document.getElementById('newStaffUser').value.trim(),password=document.getElementById('newStaffPass').value,role=document.getElementById('newStaffRole').value,locationId=document.getElementById('newStaffLocation').value;if(!name||!username||!password){showToast('Fill name, username and password.',true);return}if(role==='staff'&&!locationId){showToast('Select a location for Staff.',true);return}try{await api('/api/users','POST',{name,username,password,role,locationId});await loadConfig();render();showToast('Account created.')}catch(e){showToast(e.message,true)}};window.setUserRole=async(id,role)=>{try{await api('/api/users/'+id,'PUT',{role});await loadConfig();render()}catch(e){showToast(e.message,true)}};window.setUserLocation=async(id,locationId)=>{try{await api('/api/users/'+id,'PUT',{locationId});await loadConfig();render()}catch(e){showToast(e.message,true)}};window.resetUserPassword=async id=>{const pw=prompt('New password for this account:');if(!pw)return;try{await api('/api/users/'+id,'PUT',{password:pw});showToast('Password updated.')}catch(e){showToast(e.message,true)}};window.removeUser=async id=>{if(!confirm('Remove this account? Past entries stay in records.'))return;try{await api('/api/users/'+id,'DELETE');await loadConfig();render()}catch(e){showToast(e.message,true)}};window.changeMyPassword=async()=>{const oldPassword=document.getElementById('oldPass').value,newPassword=document.getElementById('newPass').value;try{await api('/api/change-password','POST',{oldPassword,newPassword});showToast('Password updated.');document.getElementById('oldPass').value='';document.getElementById('newPass').value=''}catch(e){showToast(e.message,true)}};
(async()=>{try{const ok=await tryResume();if(ok){state.loading=true;render();await loadEverything()}else{state.loading=false;render()}}catch(e){console.error('Startup failed:',e);state.token=null;state.user=null;localStorage.removeItem('labbrain_token');localStorage.removeItem('roznamcha_token');state.loading=false;state.loginError='Unable to load the previous session. Please log in again.';render()}})();
</script></body></html>
