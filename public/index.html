<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roznamcha — Daily Cash Register</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');
  :root{
    --paper:#EFE9DE; --paper-raised:#F7F4EC; --ink:#202A2E; --ink-soft:#5B6660;
    --teal:#2F6F62; --teal-bg:#E3EDE8; --rust:#A84E36; --rust-bg:#F3E5DE;
    --gold:#A87C1F; --gold-bg:#F1E6CD; --line:#D3C9B4; --line-soft:#E2DACB;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background:var(--paper); color:var(--ink); font-family:'Inter',system-ui,-apple-system,sans-serif; font-size:14px; line-height:1.45; }
  #app{ max-width:1080px; margin:0 auto; padding:28px 20px 60px; }

  .brand{ display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:22px; border-bottom:1px solid var(--line); padding-bottom:16px;}
  .brand-name{ font-family:'Source Serif 4',serif; font-weight:700; font-size:30px; }
  .brand-sub{ color:var(--ink-soft); font-size:13px; margin-top:2px; }
  .brand-left{ display:flex; flex-direction:column; }
  .who{ display:flex; align-items:center; gap:12px; }
  .who .name{ font-size:13.5px; } .who .role{ font-size:11px; color:var(--ink-soft); }

  nav.tabs{ display:flex; gap:4px; }
  nav.tabs button{ background:none; border:1px solid transparent; color:var(--ink-soft); font-size:13.5px; padding:8px 14px; border-radius:999px; cursor:pointer; }
  nav.tabs button.active{ background:var(--ink); color:var(--paper-raised); }
  nav.tabs button:not(.active):hover{ border-color:var(--line); color:var(--ink); }

  .row{ display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start; }
  .col{ flex:1; min-width:280px; }
  .card{ background:var(--paper-raised); border:1px solid var(--line); border-radius:10px; padding:18px 20px; }
  .card + .card{ margin-top:16px; }
  .card h3{ font-family:'Source Serif 4',serif; font-size:17px; margin:0 0 12px; font-weight:600; }
  .hint{ color:var(--ink-soft); font-size:12.5px; margin-top:4px; }

  .date-picker{ display:flex; align-items:center; gap:8px; }
  .date-picker input[type=date]{ font-family:'IBM Plex Mono'; border:1px solid var(--line); background:var(--paper); padding:6px 10px; border-radius:6px; font-size:13px; }
  button.linklike{ background:none; border:none; color:var(--teal); cursor:pointer; font-size:13px; padding:0; text-decoration:underline; }

  .group-label{ font-size:11.5px; color:var(--ink-soft); margin:4px 0 8px; }
  .tile-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px; margin-bottom:16px; }
  .tile{ border:1px solid var(--line); background:var(--paper); border-radius:8px; padding:12px; cursor:pointer; text-align:left; transition:transform .08s ease; }
  .tile:hover{ transform:translateY(-1px); }
  .tile.income{ border-left:4px solid var(--teal); } .tile.expense{ border-left:4px solid var(--rust); }
  .tile .tname{ font-size:13.5px; font-weight:500; display:block; }
  .tile .ttoday{ font-family:'IBM Plex Mono'; font-size:12px; color:var(--ink-soft); margin-top:4px; display:block; }

  .summary-line{ display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px dashed var(--line-soft); }
  .summary-line:last-child{ border-bottom:none; }
  .summary-line .amt{ font-family:'IBM Plex Mono'; font-weight:600; }
  .summary-line.net{ font-size:16px; margin-top:4px; padding-top:12px; border-top:1px solid var(--line); border-bottom:none; }
  .pos{ color:var(--teal); } .neg{ color:var(--rust); }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; color:var(--ink-soft); font-weight:500; font-size:12px; padding:6px 8px; border-bottom:1px solid var(--line); }
  td{ padding:7px 8px; border-bottom:1px solid var(--line-soft); vertical-align:top; }
  td.amt, th.amt{ font-family:'IBM Plex Mono'; text-align:right; white-space:nowrap; }
  tr.income-row td.amt{ color:var(--teal); } tr.expense-row td.amt{ color:var(--rust); }
  .del-btn{ background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:12px; }
  .del-btn:hover{ color:var(--rust); }
  .muted-row td{ color:var(--ink-soft); font-style:italic; }

  .field label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:4px; }
  .field input, .field select{ font-family:'IBM Plex Mono'; border:1px solid var(--line); background:var(--paper); padding:8px 10px; border-radius:6px; font-size:14px; width:100%; }
  .btn{ background:var(--ink); color:var(--paper-raised); border:none; padding:9px 18px; border-radius:7px; font-size:13.5px; cursor:pointer; }
  .btn:hover{ opacity:.88; } .btn.secondary{ background:none; border:1px solid var(--line); color:var(--ink); }
  .btn.danger{ background:var(--rust); }
  .badge{ display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; }
  .badge.ok{ background:var(--teal-bg); color:var(--teal); } .badge.mismatch{ background:var(--rust-bg); color:var(--rust); } .badge.closed{ background:var(--gold-bg); color:var(--gold); }
  .badge.role-admin{ background:var(--gold-bg); color:var(--gold); } .badge.role-staff{ background:var(--teal-bg); color:var(--teal); }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(32,42,46,.35); display:flex; align-items:center; justify-content:center; z-index:50; }
  .modal{ background:var(--paper-raised); border-radius:12px; padding:24px; width:340px; border:1px solid var(--line); }
  .modal h4{ font-family:'Source Serif 4',serif; margin:0 0 14px; font-size:17px; }
  .modal .field{ margin-bottom:14px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; }

  .filters{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
  select, input[type=month]{ font-family:'Inter'; border:1px solid var(--line); background:var(--paper); padding:7px 10px; border-radius:6px; font-size:13px; }

  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .bar-label{ width:130px; font-size:12.5px; flex-shrink:0; }
  .bar-track{ flex:1; background:var(--line-soft); border-radius:4px; height:14px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:4px; } .bar-fill.income{ background:var(--teal); } .bar-fill.expense{ background:var(--rust); }
  .bar-amt{ width:90px; text-align:right; font-family:'IBM Plex Mono'; font-size:12.5px; flex-shrink:0; }

  .settings-list{ display:flex; flex-direction:column; gap:8px; }
  .settings-item{ display:flex; align-items:center; gap:8px; }
  .settings-item input[type=text]{ flex:1; font-family:'Inter'; border:1px solid var(--line); background:var(--paper); padding:6px 10px; border-radius:6px; }
  .icon-btn{ background:none; border:1px solid var(--line); border-radius:6px; padding:5px 9px; cursor:pointer; color:var(--ink-soft); white-space:nowrap; }
  .icon-btn:hover{ color:var(--rust); border-color:var(--rust); }
  .add-row{ display:flex; gap:8px; margin-top:6px; }

  .loading{ color:var(--ink-soft); padding:30px 0; text-align:center; font-size:13.5px; }
  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper-raised); padding:9px 18px; border-radius:8px; font-size:13px; z-index:100; }
  .toast.err{ background:var(--rust); }
  .disclosure{ font-size:11.5px; color:var(--ink-soft); margin-top:18px; text-align:center; }

  .login-wrap{ max-width:360px; margin:80px auto; }
  .login-card{ background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; padding:32px; }
  .login-card .field{ margin-bottom:16px; }
  .login-title{ font-family:'Source Serif 4',serif; font-size:24px; margin-bottom:4px; }
</style>
</head>
<body>
<div id="app"><div class="loading">Loading…</div></div>

<script>
const OTHER_VAL = '__other__';
function money(n){ return 'Rs ' + Number(n||0).toLocaleString('en-PK'); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toYMD(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function todayStr(){ return toYMD(new Date()); }
function monthKeyOf(s){ return s.slice(0,7); }
function yearKeyOf(s){ return s.slice(0,4); }
function fmtDate(s){ return new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtMonthLabel(mk){ const [y,m]=mk.split('-'); return new Date(+y,+m-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'}); }

const state = {
  token: localStorage.getItem('roznamcha_token') || null,
  user: null,
  view: 'today',
  categories: [], employees: [], vendors: [], staff: [],
  currentDate: todayStr(),
  entriesCache: {},     // monthKey -> array (as seen by current viewer)
  handover: null,
  modal: null,
  toast: null,
  reportPeriodType: 'month',
  reportMonth: monthKeyOf(todayStr()),
  reportYear: yearKeyOf(todayStr()),
  reportUserFilter: 'all',
  loading: true,
  loginError: null
};

async function api(path, method, body){
  const headers = {'Content-Type':'application/json'};
  if(state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch(path, { method: method||'GET', headers, body: body?JSON.stringify(body):undefined });
  if(res.status === 401){ doLogout(false); throw new Error('Session expired — please log in again.'); }
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || 'Something went wrong');
  return data;
}
function showToast(msg, isErr){ state.toast = {msg, isErr}; render(); setTimeout(()=>{ state.toast=null; render(); }, 2500); }

// ---------------- Auth ----------------
async function tryResume(){
  if(!state.token) return false;
  try{ const {user} = await api('/api/me'); state.user = user; return true; }
  catch(e){ state.token=null; localStorage.removeItem('roznamcha_token'); return false; }
}
window.doLogin = async function(){
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  try{
    const data = await api('/api/login', 'POST', {username, password});
    state.token = data.token; state.user = data.user;
    localStorage.setItem('roznamcha_token', state.token);
    state.loading = true; render();
    await loadEverything();
  }catch(e){ state.loginError = e.message; render(); }
};
function doLogout(shouldRender){
  state.token = null; state.user = null;
  localStorage.removeItem('roznamcha_token');
  if(shouldRender !== false) render();
}
window.logout = function(){ doLogout(); };

// ---------------- Data loading ----------------
async function loadConfig(){
  const cfg = await api('/api/config');
  state.categories = cfg.categories; state.employees = cfg.employees; state.vendors = cfg.vendors; state.staff = cfg.staff;
}
async function loadMonth(mk, username){
  const q = (state.user.role==='admin' && username) ? ('&username='+encodeURIComponent(username)) : '';
  const data = await api('/api/entries?month='+mk+q);
  state.entriesCache[mk] = data.entries;
  return data.entries;
}
async function loadHandover(date){
  const data = await api('/api/handover?date='+date);
  state.handover = data.handover;
}
async function loadEverything(){
  await loadConfig();
  await loadMonth(monthKeyOf(state.currentDate));
  await loadHandover(state.currentDate);
  state.loading = false;
  render();
}

function catById(id){ return state.categories.find(c=>c.id===id) || {id,name:id,type:'expense',linkedList:'none'}; }
function listForCategory(cat){ return cat.linkedList==='employees'?state.employees:cat.linkedList==='vendors'?state.vendors:[]; }
function summarize(entries){
  let income=0, expense=0; const byCat={};
  entries.forEach(e=>{
    const cat = catById(e.catId);
    byCat[e.catId] = byCat[e.catId] || {name:cat.name, type:cat.type, total:0};
    byCat[e.catId].total += e.amount;
    if(cat.type==='income') income+=e.amount; else expense+=e.amount;
  });
  return {income, expense, net:income-expense, byCat};
}

// ---------------- Render root ----------------
function render(){
  const app = document.getElementById('app');
  if(!state.token || !state.user){ app.innerHTML = renderLogin(); return; }
  if(state.loading){ app.innerHTML = '<div class="loading">Loading register…</div>'; return; }
  app.innerHTML = renderBrand() +
    (state.view==='today' ? renderToday() : state.view==='reports' ? renderReports() : renderSettings()) +
    (state.modal ? renderModal() : '') +
    (state.toast ? `<div class="toast ${state.toast.isErr?'err':''}">${escapeHtml(state.toast.msg)}</div>` : '') +
    `<div class="disclosure">Server: ${escapeHtml(location.host)} — data lives on this server only.</div>`;
}

function renderLogin(){
  return `
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-title">Roznamcha</div>
      <div class="hint" style="margin-bottom:20px;">Daily cash register — log in to continue</div>
      <div class="field"><label>Username</label><input type="text" id="loginUser" onkeydown="if(event.key==='Enter') doLogin()"></div>
      <div class="field"><label>Password</label><input type="password" id="loginPass" onkeydown="if(event.key==='Enter') doLogin()"></div>
      ${state.loginError ? `<div class="hint" style="color:var(--rust); margin-bottom:12px;">${escapeHtml(state.loginError)}</div>` : ''}
      <button class="btn" style="width:100%;" onclick="doLogin()">Log in</button>
    </div>
  </div>`;
}

function renderBrand(){
  return `
  <div class="brand">
    <div class="brand-left">
      <div class="brand-name">Roznamcha</div>
      <div class="brand-sub">Daily cash register — labs, imaging &amp; expenses</div>
    </div>
    <div class="row" style="align-items:center; gap:18px;">
      <nav class="tabs">
        <button class="${state.view==='today'?'active':''}" onclick="setView('today')">Today</button>
        <button class="${state.view==='reports'?'active':''}" onclick="setView('reports')">Reports</button>
        <button class="${state.view==='settings'?'active':''}" onclick="setView('settings')">Settings</button>
      </nav>
      <div class="who">
        <div><div class="name">${escapeHtml(state.user.name)}</div><span class="badge role-${state.user.role}">${state.user.role}</span></div>
        <button class="linklike" onclick="logout()">Log out</button>
      </div>
    </div>
  </div>`;
}
window.setView = function(v){ state.view=v; render(); if(v==='reports') loadReportBody(); };

// ---------------- Today ----------------
function renderToday(){
  const mk = monthKeyOf(state.currentDate);
  const entries = (state.entriesCache[mk] || []).filter(e=>e.date===state.currentDate);
  const s = summarize(entries);
  const closed = !!(state.handover && state.handover.closedAt);
  const incomeCats = state.categories.filter(c=>c.type==='income');
  const expenseCats = state.categories.filter(c=>c.type==='expense');

  function tile(c){
    const t = (s.byCat[c.id]&&s.byCat[c.id].total)||0;
    return `<button class="tile ${c.type}" ${closed?'disabled style="opacity:.5;cursor:not-allowed;"':''} onclick="openModal('${c.id}')">
      <span class="tname">${escapeHtml(c.name)}</span><span class="ttoday">${t?money(t):'—'}</span></button>`;
  }
  const rows = entries.sort((a,b)=>a.ts-b.ts).map(e=>{
    const cat = catById(e.catId);
    return `<tr class="${cat.type}-row">
      <td>${new Date(e.ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</td>
      <td>${escapeHtml(cat.name)}</td>
      <td>${escapeHtml(e.person)||'—'}</td>
      <td class="amt">${cat.type==='income'?'+':'−'} ${money(e.amount)}</td>
      <td>${escapeHtml(e.note)}</td>
      <td>${(closed)?'':`<button class="del-btn" onclick="removeEntry('${e.id}')">remove</button>`}</td>
    </tr>`;
  }).join('') || `<tr class="muted-row"><td colspan="6">No entries yet today — click a category above.</td></tr>`;

  return `
  <div class="row" style="margin-bottom:16px;">
    <div class="date-picker">
      <span class="hint" style="margin:0;">Date</span>
      <input type="date" value="${state.currentDate}" onchange="changeDate(this.value)">
      <button class="linklike" onclick="changeDate('${todayStr()}')">Today</button>
    </div>
    ${closed?'<span class="badge closed">Handed over — day closed</span>':''}
  </div>
  <div class="row">
    <div class="col" style="flex:2; min-width:340px;">
      <div class="card">
        <h3>Income — tests done</h3>
        <div class="tile-grid">${incomeCats.map(tile).join('')||'<span class="hint">No income categories yet.</span>'}</div>
        <h3>Expenses paid out</h3>
        <div class="tile-grid">${expenseCats.map(tile).join('')||'<span class="hint">No expense categories yet.</span>'}</div>
      </div>
      <div class="card">
        <h3>My entries — ${fmtDate(state.currentDate)}</h3>
        <table><thead><tr><th>Time</th><th>Category</th><th>Who / Vendor</th><th class="amt">Amount</th><th>Remarks</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div>
    </div>
    <div class="col" style="min-width:260px;">
      <div class="card">
        <h3>Summary</h3>
        <div class="summary-line"><span>Income collected</span><span class="amt pos">${money(s.income)}</span></div>
        <div class="summary-line"><span>Expenses paid</span><span class="amt neg">${money(s.expense)}</span></div>
        <div class="summary-line net"><span>Cash in hand</span><span class="amt">${money(s.net)}</span></div>
      </div>
      <div class="card"><h3>Hand over cash</h3>${closed?renderClosedHandover():renderOpenHandover(s)}</div>
    </div>
  </div>`;
}
function renderOpenHandover(s){
  return `<div class="field" style="margin-bottom:12px;"><label>Cash actually counted</label><input type="number" id="countedInput" placeholder="${s.net}"></div>
  <div class="hint" style="margin-bottom:10px;">Calculated: <strong>${money(s.net)}</strong></div>
  <button class="btn" onclick="closeDay()">Close day &amp; hand over</button>`;
}
function renderClosedHandover(){
  const rec = state.handover; const diff = rec.counted - rec.calculated;
  const badge = diff===0?'<span class="badge ok">Matched</span>':`<span class="badge mismatch">Off by ${money(Math.abs(diff))} ${diff>0?'(extra)':'(short)'}</span>`;
  return `<div class="summary-line"><span>Calculated</span><span class="amt">${money(rec.calculated)}</span></div>
  <div class="summary-line"><span>Counted</span><span class="amt">${money(rec.counted)}</span></div>
  <div style="margin:10px 0;">${badge}</div>
  <button class="btn secondary" onclick="reopenDay()">Reopen day</button>`;
}
window.changeDate = async function(dateStr){
  state.currentDate = dateStr;
  await loadMonth(monthKeyOf(dateStr));
  await loadHandover(dateStr);
  render();
};
window.openModal = function(catId){ state.modal={catId}; render(); setTimeout(()=>{ const el=document.getElementById('amountInput'); if(el) el.focus(); },30); };
window.closeModal = function(){ state.modal=null; render(); };

function renderModal(){
  const cat = catById(state.modal.catId);
  const list = listForCategory(cat);
  const hasList = cat.linkedList && cat.linkedList!=='none';
  const listLabel = cat.linkedList==='employees'?'Employee':'Vendor';
  return `<div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <h4>${escapeHtml(cat.name)} <span style="color:var(--ink-soft); font-weight:400; font-size:13px;">(${cat.type})</span></h4>
      <div class="field"><label>Amount</label><input type="number" id="amountInput" placeholder="0"></div>
      ${hasList?`<div class="field"><label>${listLabel}</label>
        <select id="personSelect" onchange="document.getElementById('personOtherWrap').style.display=this.value==='${OTHER_VAL}'?'block':'none';">
          <option value="">— select —</option>
          ${list.map(n=>`<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('')}
          <option value="${OTHER_VAL}">Other (not in list)</option>
        </select></div>
        <div class="field" id="personOtherWrap" style="display:none;"><label>Type ${listLabel.toLowerCase()} name</label><input type="text" id="personOtherInput"></div>`:''}
      <div class="field"><label>Remarks (optional)</label><input type="text" id="noteInput" placeholder="${hasList?'e.g. paid in cash':'e.g. handed to Mr Ali'}"></div>
      <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="submitEntry()">Add</button></div>
    </div></div>`;
}
window.submitEntry = async function(){
  const cat = catById(state.modal.catId);
  const amt = document.getElementById('amountInput').value;
  const note = document.getElementById('noteInput').value;
  if(!amt || Number(amt)<=0){ showToast('Enter an amount first.', true); return; }
  let person = '';
  if(cat.linkedList && cat.linkedList!=='none'){
    const sel = document.getElementById('personSelect').value;
    if(sel===OTHER_VAL){ person = document.getElementById('personOtherInput').value.trim(); if(!person){ showToast('Type a name, or pick from the list.', true); return; } }
    else if(sel===''){ showToast('Please select '+(cat.linkedList==='employees'?'an employee':'a vendor')+'.', true); return; }
    else person = sel;
  }
  try{
    await api('/api/entries','POST',{ date: state.currentDate, catId: cat.id, amount: amt, note, person });
    await loadMonth(monthKeyOf(state.currentDate));
    state.modal = null; render();
  }catch(e){ showToast(e.message, true); }
};
window.removeEntry = async function(id){
  try{ await api('/api/entries/'+id+'?month='+monthKeyOf(state.currentDate), 'DELETE'); await loadMonth(monthKeyOf(state.currentDate)); render(); }
  catch(e){ showToast(e.message, true); }
};
window.closeDay = async function(){
  const mk = monthKeyOf(state.currentDate);
  const entries = (state.entriesCache[mk]||[]).filter(e=>e.date===state.currentDate);
  const s = summarize(entries);
  const el = document.getElementById('countedInput');
  const counted = el.value===''? s.net : Number(el.value);
  try{ await api('/api/handover','POST',{date:state.currentDate, calculated:s.net, counted}); await loadHandover(state.currentDate); render(); }
  catch(e){ showToast(e.message, true); }
};
window.reopenDay = async function(){
  try{ await api('/api/handover/reopen','POST',{date:state.currentDate}); await loadHandover(state.currentDate); render(); }
  catch(e){ showToast(e.message, true); }
};

// ---------------- Reports ----------------
function renderReports(){
  const showStaffFilter = state.user.role === 'admin';
  return `<div class="card">
    <div class="filters">
      <select onchange="setReportPeriodType(this.value)">
        <option value="month" ${state.reportPeriodType==='month'?'selected':''}>Monthly</option>
        <option value="year" ${state.reportPeriodType==='year'?'selected':''}>Yearly</option>
      </select>
      ${state.reportPeriodType==='month'
        ? `<input type="month" value="${state.reportMonth}" onchange="setReportMonth(this.value)">`
        : `<input type="number" style="width:90px;" value="${state.reportYear}" onchange="setReportYear(this.value)">`}
      ${showStaffFilter ? `<select onchange="setReportUser(this.value)">
        <option value="all" ${state.reportUserFilter==='all'?'selected':''}>All staff</option>
        ${state.staff.map(u=>`<option value="${escapeHtml(u.username||u.id)}" ${state.reportUserFilter===(u.username||u.id)?'selected':''}>${escapeHtml(u.name)}</option>`).join('')}
      </select>` : ''}
    </div>
    <div id="reportBody" class="loading">Crunching numbers…</div>
  </div>`;
}
window.setReportPeriodType = function(v){ state.reportPeriodType=v; render(); loadReportBody(); };
window.setReportMonth = function(v){ state.reportMonth=v; render(); loadReportBody(); };
window.setReportYear = function(v){ state.reportYear=v; render(); loadReportBody(); };
window.setReportUser = function(v){ state.reportUserFilter=v; render(); loadReportBody(); };

async function loadReportBody(){
  let monthKeys = [];
  if(state.reportPeriodType==='month') monthKeys=[state.reportMonth];
  else { const {months} = await api('/api/entries-months?year='+state.reportYear); monthKeys = months; }

  let all = [];
  for(const mk of monthKeys){ const filterUser = state.user.role==='admin' ? state.reportUserFilter : undefined; all = all.concat(await loadMonth(mk, filterUser)); }
  const s = summarize(all);

  const byUser = {};
  all.forEach(e=>{ byUser[e.name] = byUser[e.name]||{income:0,expense:0}; const cat=catById(e.catId); if(cat.type==='income') byUser[e.name].income+=e.amount; else byUser[e.name].expense+=e.amount; });

  const byPerson = {};
  all.forEach(e=>{ if(!e.person) return; const cat=catById(e.catId); const key=e.catId+'::'+e.person; byPerson[key]=byPerson[key]||{catName:cat.name,person:e.person,total:0}; byPerson[key].total+=e.amount; });

  let handoverRows = [];
  if(state.reportPeriodType==='month'){
    const {rows} = await api('/api/handover-history?month='+state.reportMonth);
    handoverRows = state.user.role==='admin' && state.reportUserFilter!=='all' ? rows.filter(r=>r.username===state.reportUserFilter) : rows;
  }

  const maxCat = Math.max(1, ...Object.values(s.byCat).map(c=>c.total));
  const catBars = Object.values(s.byCat).sort((a,b)=>b.total-a.total).map(c=>`
    <div class="bar-row"><div class="bar-label">${escapeHtml(c.name)}</div>
    <div class="bar-track"><div class="bar-fill ${c.type}" style="width:${(c.total/maxCat*100).toFixed(1)}%"></div></div>
    <div class="bar-amt">${money(c.total)}</div></div>`).join('') || `<div class="hint">No entries in this period.</div>`;

  const userRows = Object.keys(byUser).sort().map(u=>{ const b=byUser[u]; return `<tr><td>${escapeHtml(u)}</td><td class="amt" style="color:var(--teal)">${money(b.income)}</td><td class="amt" style="color:var(--rust)">${money(b.expense)}</td><td class="amt">${money(b.income-b.expense)}</td></tr>`; }).join('') || `<tr class="muted-row"><td colspan="4">No entries in this period.</td></tr>`;

  const personRows = Object.values(byPerson).sort((a,b)=>b.total-a.total).map(p=>`<tr><td>${escapeHtml(p.catName)}</td><td>${escapeHtml(p.person)}</td><td class="amt">${money(p.total)}</td></tr>`).join('') || `<tr class="muted-row"><td colspan="3">No employee/vendor-linked entries in this period.</td></tr>`;

  const handoverRowsHtml = handoverRows.map(h=>{ const diff=h.counted-h.calculated; return `<tr><td>${fmtDate(h.date)}</td><td>${escapeHtml(h.username)}</td><td class="amt">${money(h.calculated)}</td><td class="amt">${money(h.counted)}</td><td>${diff===0?'<span class="badge ok">Matched</span>':`<span class="badge mismatch">${diff>0?'+':''}${money(diff)}</span>`}</td></tr>`; }).join('') || `<tr class="muted-row"><td colspan="5">No handovers closed this month yet.</td></tr>`;

  const label = state.reportPeriodType==='month' ? fmtMonthLabel(state.reportMonth) : state.reportYear;
  const el = document.getElementById('reportBody');
  if(!el) return;
  el.innerHTML = `
    <h3>${label}</h3>
    <div class="summary-line"><span>Total income</span><span class="amt pos">${money(s.income)}</span></div>
    <div class="summary-line"><span>Total expense</span><span class="amt neg">${money(s.expense)}</span></div>
    <div class="summary-line net"><span>Net</span><span class="amt">${money(s.net)}</span></div>
    <div class="group-label" style="margin-top:20px;">Nature of expense / income</div>${catBars}
    <div class="group-label" style="margin-top:22px;">By employee / vendor</div>
    <table><thead><tr><th>Category</th><th>Name</th><th class="amt">Total</th></tr></thead><tbody>${personRows}</tbody></table>
    ${state.user.role==='admin'?`<div class="group-label" style="margin-top:22px;">By staff</div>
    <table><thead><tr><th>Staff</th><th class="amt">Income</th><th class="amt">Expense</th><th class="amt">Net</th></tr></thead><tbody>${userRows}</tbody></table>`:''}
    ${state.reportPeriodType==='month'?`<div class="group-label" style="margin-top:22px;">Cash handover history</div>
    <table><thead><tr><th>Date</th><th>Staff</th><th class="amt">Calculated</th><th class="amt">Counted</th><th>Status</th></tr></thead><tbody>${handoverRowsHtml}</tbody></table>`:''}
  `;
}

// ---------------- Settings ----------------
function renderSettings(){
  const isAdmin = state.user.role==='admin';
  const catRows = state.categories.map((c,i)=>`
    <div class="settings-item">
      <input type="text" value="${escapeHtml(c.name)}" ${isAdmin?`onchange="renameCategory(${i}, this.value)"`:'disabled'}>
      <select ${isAdmin?`onchange="setCategoryType(${i}, this.value)"`:'disabled'}>
        <option value="income" ${c.type==='income'?'selected':''}>Income</option>
        <option value="expense" ${c.type==='expense'?'selected':''}>Expense</option>
      </select>
      <select ${isAdmin?`onchange="setCategoryLinkedList(${i}, this.value)"`:'disabled'}>
        <option value="none" ${c.linkedList==='none'?'selected':''}>No list</option>
        <option value="employees" ${c.linkedList==='employees'?'selected':''}>Employees list</option>
        <option value="vendors" ${c.linkedList==='vendors'?'selected':''}>Vendors list</option>
      </select>
      ${isAdmin?`<button class="icon-btn" onclick="removeCategory(${i})">Remove</button>`:''}
    </div>`).join('');

  const empRows = state.employees.map((e,i)=>`<div class="settings-item"><input type="text" value="${escapeHtml(e)}" ${isAdmin?`onchange="renameEmployee(${i}, this.value)"`:'disabled'}>${isAdmin?`<button class="icon-btn" onclick="removeEmployee(${i})">Remove</button>`:''}</div>`).join('') || `<div class="hint">No employees added yet.</div>`;
  const vendRows = state.vendors.map((v,i)=>`<div class="settings-item"><input type="text" value="${escapeHtml(v)}" ${isAdmin?`onchange="renameVendor(${i}, this.value)"`:'disabled'}>${isAdmin?`<button class="icon-btn" onclick="removeVendor(${i})">Remove</button>`:''}</div>`).join('') || `<div class="hint">No vendors added yet.</div>`;

  const staffRows = isAdmin ? state.staff.map(u=>`
    <div class="settings-item">
      <span style="flex:1;">${escapeHtml(u.name)} <span class="hint">(${escapeHtml(u.username)})</span></span>
      <select onchange="setUserRole('${u.id}', this.value)">
        <option value="staff" ${u.role==='staff'?'selected':''}>Staff</option>
        <option value="admin" ${u.role==='admin'?'selected':''}>Admin</option>
      </select>
      <button class="icon-btn" onclick="resetUserPassword('${u.id}')">Reset password</button>
      ${u.id!==state.user.id?`<button class="icon-btn" onclick="removeUser('${u.id}')">Remove</button>`:''}
    </div>`).join('') : '';

  return `
  <div class="row">
    <div class="col" style="flex:2; min-width:420px;">
      <div class="card">
        <h3>Categories (ledger headers)</h3>
        <div class="hint" style="margin-bottom:10px;">${isAdmin?'Set each category type and, if it should be tracked per person, which list to pick from.':'Only admins can edit categories.'}</div>
        <div class="settings-list">${catRows}</div>
        ${isAdmin?`<div class="add-row"><input type="text" id="newCatName" placeholder="New category name" style="flex:1;">
          <select id="newCatType"><option value="income">Income</option><option value="expense">Expense</option></select>
          <button class="btn secondary" onclick="addCategory()">Add</button></div>`:''}
      </div>
      ${isAdmin?`<div class="card">
        <h3>Staff accounts</h3>
        <div class="settings-list">${staffRows}</div>
        <div class="add-row">
          <input type="text" id="newStaffName" placeholder="Full name" style="flex:1;">
          <input type="text" id="newStaffUser" placeholder="Username" style="flex:1;">
          <input type="text" id="newStaffPass" placeholder="Password" style="flex:1;">
          <button class="btn secondary" onclick="addStaff()">Add</button>
        </div>
      </div>`:''}
      <div class="card">
        <h3>Change my password</h3>
        <div class="field" style="margin-bottom:10px;"><label>Current password</label><input type="password" id="oldPass"></div>
        <div class="field" style="margin-bottom:10px;"><label>New password</label><input type="password" id="newPass"></div>
        <button class="btn secondary" onclick="changeMyPassword()">Update password</button>
      </div>
    </div>
    <div class="col" style="min-width:260px;">
      <div class="card"><h3>Employees list</h3><div class="hint" style="margin-bottom:10px;">Used by categories set to "Employees list".</div>
        <div class="settings-list">${empRows}</div>
        ${isAdmin?`<div class="add-row"><input type="text" id="newEmpName" placeholder="Employee name" style="flex:1;"><button class="btn secondary" onclick="addEmployee()">Add</button></div>`:''}
      </div>
      <div class="card"><h3>Vendors list</h3><div class="hint" style="margin-bottom:10px;">Used by categories set to "Vendors list".</div>
        <div class="settings-list">${vendRows}</div>
        ${isAdmin?`<div class="add-row"><input type="text" id="newVendName" placeholder="Vendor name" style="flex:1;"><button class="btn secondary" onclick="addVendor()">Add</button></div>`:''}
      </div>
    </div>
  </div>`;
}

async function refreshConfigAndRender(){ try{ await loadConfig(); render(); }catch(e){ showToast(e.message, true); } }

window.renameCategory = async function(i,v){ state.categories[i].name=v; try{ await api('/api/config/categories','PUT',{categories:state.categories}); }catch(e){ showToast(e.message,true); } };
window.setCategoryType = async function(i,v){ state.categories[i].type=v; try{ await api('/api/config/categories','PUT',{categories:state.categories}); render(); }catch(e){ showToast(e.message,true); } };
window.setCategoryLinkedList = async function(i,v){ state.categories[i].linkedList=v; try{ await api('/api/config/categories','PUT',{categories:state.categories}); render(); }catch(e){ showToast(e.message,true); } };
window.removeCategory = async function(i){ state.categories.splice(i,1); try{ await api('/api/config/categories','PUT',{categories:state.categories}); render(); }catch(e){ showToast(e.message,true); } };
window.addCategory = async function(){
  const name = document.getElementById('newCatName').value.trim(); const type = document.getElementById('newCatType').value;
  if(!name) return;
  state.categories.push({id: name.toLowerCase().replace(/[^a-z0-9]+/g,'_')+'_'+Math.random().toString(36).slice(2,6), name, type, linkedList:'none'});
  try{ await api('/api/config/categories','PUT',{categories:state.categories}); render(); }catch(e){ showToast(e.message,true); }
};
window.renameEmployee = async function(i,v){ state.employees[i]=v; try{ await api('/api/config/employees','PUT',{employees:state.employees}); }catch(e){ showToast(e.message,true); } };
window.removeEmployee = async function(i){ state.employees.splice(i,1); try{ await api('/api/config/employees','PUT',{employees:state.employees}); render(); }catch(e){ showToast(e.message,true); } };
window.addEmployee = async function(){
  const name = document.getElementById('newEmpName').value.trim(); if(!name) return;
  state.employees.push(name); try{ await api('/api/config/employees','PUT',{employees:state.employees}); render(); }catch(e){ showToast(e.message,true); }
};
window.renameVendor = async function(i,v){ state.vendors[i]=v; try{ await api('/api/config/vendors','PUT',{vendors:state.vendors}); }catch(e){ showToast(e.message,true); } };
window.removeVendor = async function(i){ state.vendors.splice(i,1); try{ await api('/api/config/vendors','PUT',{vendors:state.vendors}); render(); }catch(e){ showToast(e.message,true); } };
window.addVendor = async function(){
  const name = document.getElementById('newVendName').value.trim(); if(!name) return;
  state.vendors.push(name); try{ await api('/api/config/vendors','PUT',{vendors:state.vendors}); render(); }catch(e){ showToast(e.message,true); }
};

window.addStaff = async function(){
  const name = document.getElementById('newStaffName').value.trim();
  const username = document.getElementById('newStaffUser').value.trim();
  const password = document.getElementById('newStaffPass').value;
  if(!name||!username||!password){ showToast('Fill name, username and password.', true); return; }
  try{ await api('/api/users','POST',{name, username, password, role:'staff'}); await refreshConfigAndRender(); showToast('Staff account created.'); }
  catch(e){ showToast(e.message, true); }
};
window.setUserRole = async function(id, role){ try{ await api('/api/users/'+id,'PUT',{role}); await refreshConfigAndRender(); }catch(e){ showToast(e.message,true); } };
window.resetUserPassword = async function(id){
  const pw = prompt('New password for this account:');
  if(!pw) return;
  try{ await api('/api/users/'+id,'PUT',{password:pw}); showToast('Password updated.'); }catch(e){ showToast(e.message,true); }
};
window.removeUser = async function(id){
  if(!confirm('Remove this staff account? Their past entries stay in the records.')) return;
  try{ await api('/api/users/'+id,'DELETE'); await refreshConfigAndRender(); }catch(e){ showToast(e.message,true); }
};
window.changeMyPassword = async function(){
  const oldPassword = document.getElementById('oldPass').value;
  const newPassword = document.getElementById('newPass').value;
  try{ await api('/api/change-password','POST',{oldPassword,newPassword}); showToast('Password updated.'); document.getElementById('oldPass').value=''; document.getElementById('newPass').value=''; }
  catch(e){ showToast(e.message, true); }
};

// ---------------- Init ----------------
(async function init(){
  const ok = await tryResume();
  if(ok){ await loadEverything(); } else { state.loading=false; render(); }
})();
</script>
</body>
</html>
