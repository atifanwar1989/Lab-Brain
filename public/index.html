<script>
const OTHER_VAL='__other__';
function money(n){return 'Rs '+Number(n||0).toLocaleString('en-PK')}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toYMD(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function todayStr(){return toYMD(new Date())} function monthKeyOf(s){return s.slice(0,7)} function yearKeyOf(s){return s.slice(0,4)}
function fmtDate(s){return new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}
function fmtMonthLabel(mk){const [y,m]=mk.split('-');return new Date(+y,+m-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'})}
const state={token:localStorage.getItem('labbrain_token')||localStorage.getItem('roznamcha_token')||null,user:null,view:'today',locations:[],selectedLocation:'all',selectedUser:'all',categories:[],employees:[],vendors:[],doctors:[],staff:[],currentDate:todayStr(),entriesCache:{},handover:null,online:0,modal:null,toast:null,reportMonth:monthKeyOf(todayStr()),reportLocation:'all',reportUser:'all',reportPanel:'overview',reportRevenueCategory:'all',patientCount:0,manualRefund:0,loading:true,loginError:null};
async function api(path,method,body){const headers={'Content-Type':'application/json'};if(state.token)headers.Authorization='Bearer '+state.token;const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),15000);try{const res=await fetch(path,{method:method||'GET',headers,body:body?JSON.stringify(body):undefined,signal:controller.signal});if(res.status===401){doLogout(false);throw new Error('Session expired — please log in again.')}const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'Something went wrong');return data}catch(e){if(e.name==='AbortError')throw new Error('Server did not respond. Please refresh and try again.');throw e}finally{clearTimeout(timer)}}
function showToast(msg,isErr){state.toast={msg,isErr};render();setTimeout(()=>{state.toast=null;render()},2500)}
async function tryResume(){if(!state.token)return false;try{state.user=(await api('/api/me')).user;return true}catch(e){state.token=null;localStorage.removeItem('labbrain_token');localStorage.removeItem('roznamcha_token');return false}}
window.doLogin=async function(){const username=document.getElementById('loginUser').value.trim(),password=document.getElementById('loginPass').value;try{const d=await api('/api/login','POST',{username,password});state.token=d.token;state.user=d.user;localStorage.setItem('labbrain_token',state.token);localStorage.removeItem('roznamcha_token');state.loading=true;render();await loadEverything()}catch(e){state.loginError=e.message;render()}}
function doLogout(r=true){state.token=null;state.user=null;localStorage.removeItem('labbrain_token');localStorage.removeItem('roznamcha_token');if(r)render()} window.logout=()=>doLogout();
async function loadConfig(){const c=await api('/api/config');state.locations=c.locations||[];state.categories=c.categories||[];state.employees=c.employees||[];state.vendors=c.vendors||[];state.doctors=c.doctors||[];state.staff=c.staff||[];if(state.user.role!=='admin')state.selectedLocation=state.user.locationId||'all'}
function locationName(id){const l=state.locations.find(x=>x.id===id);return l?l.name:'—'}
function activeCategories(){return state.categories.filter(c=>(c.locationId||'nmdc-main')===state.selectedLocation)}
async function loadMonth(mk,username,locationId){let q='';if(state.user.role==='admin'&&username&&username!=='all')q+='&username='+encodeURIComponent(username);if(state.user.role==='admin'&&locationId&&locationId!=='all')q+='&locationId='+encodeURIComponent(locationId);state.entriesCache[mk]=(await api('/api/entries?month='+mk+q)).entries;return state.entriesCache[mk]}
async function loadDayData(date){
  const username=state.user.role==='admin'?state.selectedUser:state.user.username;
  await loadMonth(monthKeyOf(date),username,state.user.role==='admin'?state.selectedLocation:undefined);
  if(state.user.role!=='admin'){state.handover=(await api('/api/handover?date='+date)).handover;state.online=(await api('/api/online?date='+date)).amount||0;state.manualRefund=(await api('/api/manual-refund?date='+date)).amount||0;state.patientCount=(await api('/api/patients?date='+date)).count||0}
  else {state.handover=null;state.online=0;state.manualRefund=0;
    const users=state.staff.filter(u=>u.role==='staff'&&(!state.selectedLocation||state.selectedLocation==='all'||u.locationId===state.selectedLocation));
    if(username&&username!=='all') state.patientCount=(await api('/api/patients?date='+date+'&username='+encodeURIComponent(username))).count||0;
    else { const vals=await Promise.all(users.map(u=>api('/api/patients?date='+date+'&username='+encodeURIComponent(u.username)).then(x=>Number(x.count||0)))); state.patientCount=vals.reduce((a,b)=>a+b,0); }
  }
}
async function loadEverything(){await loadConfig();await loadDayData(state.currentDate);state.loading=false;render()}
function catById(id){return state.categories.find(c=>c.id===id)||{id,name:id,type:'expense',linkedList:'none',locationId:'nmdc-main'}}
function listForCategory(c){if(c.linkedList==='employees')return state.employees;if(c.linkedList==='vendors')return state.vendors;if(c.linkedList==='doctors')return state.doctors;return []}
function summarize(entries){let income=0,expense=0;const byCat={};entries.forEach(e=>{const c=catById(e.catId);byCat[e.catId]=byCat[e.catId]||{name:c.name,type:c.type,total:0};byCat[e.catId].total+=Number(e.amount||0);if(c.type==='income')income+=Number(e.amount||0);else expense+=Number(e.amount||0)});return{income,expense,byCat}}
function render(){const app=document.getElementById('app');if(!state.token||!state.user){app.innerHTML=renderLogin();return}if(state.loading){app.innerHTML='<div class="loading">Loading Lab-Brain…</div>';return}app.innerHTML=renderBrand()+(state.view==='today'?renderToday():state.view==='reports'?renderReports():renderSettings())+(state.modal?renderModal():'')+(state.toast?`<div class="toast ${state.toast.isErr?'err':''}">${escapeHtml(state.toast.msg)}</div>`:'')+'<div class="disclosure">Lab-Brain — secure server-side records. Existing records are preserved during normal updates.</div>'}

function renderBrand(){const loc=state.user.role==='admin'?(state.selectedLocation==='all'?'All locations':locationName(state.selectedLocation)):locationName(state.user.locationId);const isPrime=loc.toLowerCase().includes('prime lab');const logo=isPrime?'assets/prime-lab-logo.png':'assets/nmdc-logo.png';return `<div class="brand"><div class="brand-left"><img class="brand-logo" src="${logo}" alt="${isPrime?'Prime Lab':'NMDC'} logo"><div><div class="brand-name">Lab-Brain</div><div class="brand-sub">Daily Cash Management System &nbsp;|&nbsp; ${escapeHtml(loc)}</div></div></div><div class="brand-meta"><nav class="tabs"><button class="${state.view==='today'?'active':''}" onclick="setView('today')">Today</button><button class="${state.view==='reports'?'active':''}" onclick="setView('reports')">Reports</button><button class="${state.view==='settings'?'active':''}" onclick="setView('settings')">Settings</button></nav><div class="who"><div class="who-avatar">${escapeHtml((state.user.name||'U').slice(0,1).toUpperCase())}</div><div><div class="name">${escapeHtml(state.user.name)}</div><div class="role">${state.user.role==='admin'?'Admin':'Staff'}</div></div><button class="linklike" onclick="logout()">Log out</button></div></div></div>`}
window.setView=function(v){state.view=v;render();if(v==='reports')loadReportBody()}
function renderToday(){const mk=monthKeyOf(state.currentDate),entries=(state.entriesCache[mk]||[]).filter(e=>e.date===state.currentDate&& (state.user.role==='admin'?(state.selectedLocation==='all'||e.locationId===state.selectedLocation)&&(state.selectedUser==='all'||e.username===state.selectedUser):e.username===state.user.username));const s=summarize(entries),closed=!!(state.handover&&state.handover.closedAt),isToday=state.currentDate===todayStr(),editable=state.user.role==='admin'||isToday,cats=state.user.role==='admin'?(state.selectedLocation==='all'?[]:activeCategories()):activeCategories(),incomeCats=cats.filter(c=>c.type==='income'),expenseCats=cats.filter(c=>c.type==='expense');
function tile(c){const t=s.byCat[c.id]?.total||0;return `<button class="tile ${c.type}" ${editable?'':'disabled'} onclick="openModal('${c.id}')"><span class="tname">${escapeHtml(c.name)}</span><span class="ttoday">${t?money(t):'Rs 0'}</span></button>`}
const rows=entries.sort((a,b)=>a.ts-b.ts).map(e=>{const c=catById(e.catId);return `<tr class="${c.type}-row"><td>${new Date(e.ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</td><td>${escapeHtml(c.name)}</td><td>${escapeHtml(e.person||'—')}</td><td class="amt">${c.type==='income'?'+':'−'} ${money(e.amount)}</td><td>${escapeHtml(e.note)}</td><td>${editable?`<button class="del-btn" onclick="removeEntry('${e.id}')">Remove</button>`:''}</td></tr>`}).join('')||'<tr class="muted-row"><td colspan="6">No entries for this date.</td></tr>';
const expected=s.income-state.online-state.manualRefund-s.expense;const locPick=state.user.role==='admin'?`<div class="admin-tools"><select onchange="changeLocation(this.value)"><option value="all" ${state.selectedLocation==='all'?'selected':''}>All locations</option>${state.locations.map(l=>`<option value="${l.id}" ${state.selectedLocation===l.id?'selected':''}>${escapeHtml(l.name)}</option>`).join('')}</select><select onchange="changeUser(this.value)"><option value="all" ${state.selectedUser==='all'?'selected':''}>All users</option>${state.staff.filter(u=>u.role==='staff'&&(state.selectedLocation==='all'||u.locationId===state.selectedLocation)).map(u=>`<option value="${escapeHtml(u.username)}" ${state.selectedUser===u.username?'selected':''}>${escapeHtml(u.name)}</option>`).join('')}</select></div>`:'';
const adminInfo=state.user.role==='admin'&&state.selectedLocation==='all'?'<div class="info" style="margin-bottom:14px">Select a location above to view and enter its daily categories. Consolidated management figures are available in Reports.</div>':'';
return `<div class="page-head"><div><h1 class="page-title">Daily Cash Management</h1><div class="page-subtitle">Enter today’s revenue, expenses and cash details</div>${locPick}</div><div class="date-tools"><label>Date</label><input type="date" value="${state.currentDate}" onchange="changeDate(this.value)"><button class="btn-today" onclick="changeDate('${todayStr()}')">Today</button></div></div>${state.user.role!=='admin'&&closed?'<div class="badge closed" style="margin-bottom:14px">Day closed — current date can still be corrected</div>':''}${!editable?'<div class="badge closed" style="margin-bottom:14px">Previous date — Admin correction only</div>':''}${adminInfo}
<div class="layout"><div class="main-stack">${state.user.role==='admin'&&state.selectedLocation==='all'?'':`<div class="card section-card"><div class="section-head income"><div class="section-title-left"><span class="section-icon">▣</span><span>Income — Tests / Services</span></div><span class="section-total">Total: ${money(s.income)}</span></div><div class="tile-grid">${incomeCats.map(tile).join('')||'<span class="hint">No income categories for this location.</span>'}</div><div class="section-head expense" style="margin-top:15px"><div class="section-title-left"><span class="section-icon">↳</span><span>Expenses paid out</span></div><span class="section-total">Total: ${money(s.expense)}</span></div><div class="tile-grid expense-grid">${expenseCats.map(tile).join('')||'<span class="hint">No expense categories for this location.</span>'}</div></div>`}
<div class="card"><div class="entries-head"><div class="entries-title"><span class="entries-icon">▤</span><span>${state.user.role==='admin'?'Entries':'My entries'} — ${fmtDate(state.currentDate)}</span></div><button class="add-entry-btn" ${editable?'':'disabled'} onclick="${editable?'openModal(\''+(incomeCats[0]?.id||expenseCats[0]?.id||'')+'\')':'return false'}">＋ Add Entry</button></div><div class="table-wrap"><table><thead><tr><th>Time</th><th>Category</th><th>Who / Vendor</th><th class="amt">Amount</th><th>Remarks</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>
<div class="card"><div class="section-head purple"><div class="section-title-left"><span class="section-icon">♟</span><span>Patient & Refund Entries</span></div></div><div class="patient-grid"><div class="compact-row"><span class="compact-icon patient">●</span><span class="label">Patient Count for today</span><input type="number" min="0" step="1" id="patientInput" value="${Number(state.patientCount||0)}" ${state.user.role!=='admin'&&editable?'':'disabled'}><button class="small-save" ${state.user.role!=='admin'&&editable?'':'disabled'} onclick="savePatients()">Save</button></div><div class="compact-row"><span class="compact-icon online">▣</span><span class="label">Online amount for today</span><input type="number" min="0" id="onlineInput" value="${state.online}" ${state.user.role!=='admin'&&editable?'':'disabled'}><button class="small-save" ${state.user.role!=='admin'&&editable?'':'disabled'} onclick="saveOnline()">Save</button></div><div class="hint" style="margin:-2px 0 2px 44px">Online is already included in Total Revenue; it is only deducted from expected physical cash.</div><div class="compact-row"><span class="compact-icon refund">↶</span><span class="label">Manual Refund for today</span><input type="number" min="0" id="manualRefundInput" value="${state.manualRefund}" ${state.user.role!=='admin'&&editable?'':'disabled'}><button class="small-save" ${state.user.role!=='admin'&&editable?'':'disabled'} onclick="saveManualRefund()">Save</button></div><div class="hint" style="margin:-2px 0 2px 44px">Manual Refund is deducted from expected physical cash but is not recorded as an expense.</div></div></div>
</div><div class="side-stack"><div class="card summary-card"><div class="summary-top">▥ &nbsp; Daily Summary</div><div class="summary-body"><div class="summary-line"><span>Total Revenue</span><span class="amt pos">${money(s.income)}</span></div><div class="summary-line"><span>Online</span><span class="amt neg">− ${money(state.online)}</span></div><div class="summary-line"><span>Manual Refund</span><span class="amt neg">− ${money(state.manualRefund)}</span></div><div class="summary-line"><span>Expenses</span><span class="amt neg">− ${money(s.expense)}</span></div><div class="summary-line"><span>Patient Count</span><span class="amt">${Number(state.patientCount||0).toLocaleString('en-PK')}</span></div><div class="summary-line net"><span><strong>Expected Cash</strong></span><span class="amt"><strong>${state.user.role==='admin'&&state.selectedLocation==='all'?'—':money(expected)}</strong></span></div></div></div><div class="card quick-card"><div class="quick-title">⚡ Quick Actions</div><button class="quick-btn primary" onclick="${editable&&incomeCats[0]?.id?'openModal(\''+incomeCats[0].id+'\')':'return false'}">＋ Add Entry</button><button class="quick-btn" onclick="setView('reports')">▤ View Reports</button><button class="quick-btn" onclick="window.print()">⎙ Print Summary</button></div>${state.user.role!=='admin'?`<div class="card"><div class="section-head blue"><div class="section-title-left"><span class="section-icon">↔</span><span>Cash handover</span></div></div>${renderHandover(s,expected,closed,editable)}</div>`:'<div class="card"><div class="section-head blue"><div class="section-title-left"><span class="section-icon">⚙</span><span>Management</span></div></div><div class="hint">Use Reports for consolidated revenue, cash counter expenses, patient count, locations, staff and cash mismatch history.</div></div>'}<div class="tip-card"><strong>💡 Verify before closing</strong><br><br>Please verify all entries carefully before closing the day.<br><br>Accurate records help us maintain trust and better manage our resources.</div><div class="card brand-side"><img class="brand-side-logo" src="${state.user.role==='admin'&&state.selectedLocation==='all'?'assets/nmdc-logo.png':(locationName(state.user.role==='admin'?state.selectedLocation:state.user.locationId).toLowerCase().includes('prime lab')?'assets/prime-lab-logo.png':'assets/nmdc-logo.png')}" alt="Organization logo"><div class="tagline">${state.user.role==='admin'&&state.selectedLocation==='all'?'North Mehran Diagnostic Centre':(locationName(state.user.role==='admin'?state.selectedLocation:state.user.locationId).toLowerCase().includes('prime lab')?'Prime Lab':'North Mehran Diagnostic Centre')}</div></div></div></div>`}
window.changeLocation=async function(v){state.selectedLocation=v;state.selectedUser='all';state.entriesCache={};await loadDayData(state.currentDate);render()}
window.changeUser=async function(v){state.selectedUser=v;state.entriesCache={};await loadDayData(state.currentDate);render()}
window.changeDate=async function(v){state.currentDate=v;await loadDayData(v);render()}
function renderHandover(s,expected,closed,editable){const h=state.handover||{};return `${closed?'<div class="badge closed" style="margin-bottom:10px">Handover saved</div>':''}<div class="summary-line"><span>Expected Cash</span><span class="amt">${money(expected)}</span></div><div class="field" style="margin-top:12px"><label>Cash Short</label><input type="number" min="0" id="shortInput" value="${Number(h.cashShort||0)}" ${editable?'':'disabled'}></div><div class="field" style="margin-top:10px"><label>Excess Cash</label><input type="number" min="0" id="excessInput" value="${Number(h.excessCash||0)}" ${editable?'':'disabled'}></div><div class="hint" style="margin:8px 0">Expected Cash already includes Online and Manual Refund deductions. System calculates actual cash as Expected − Short + Excess.</div>${h.cashShort?`<div class="warning" style="margin-bottom:10px">Cash Short: <strong>${money(h.cashShort)}</strong>${h.remark?` — ${escapeHtml(h.remark)}`:''}</div>`:''}${h.excessCash?`<div class="info" style="margin-bottom:10px">Excess Cash: <strong>${money(h.excessCash)}</strong></div>`:''}<div class="field"><label>Mismatch remarks</label><input type="text" id="mismatchRemark" value="${escapeHtml(h.remark||'')}" ${editable?'':'disabled'} placeholder="e.g. Rs 500 short, amount not found"></div>${editable?`<button class="btn" style="margin-top:12px" onclick="saveHandover()">${closed?'Update handover':'Close day & hand over'}</button>`:''}`}
window.openModal=function(id){state.modal={catId:id};render();setTimeout(()=>document.getElementById('amountInput')?.focus(),30)};window.closeModal=function(){state.modal=null;render()}
function renderModal(){const c=catById(state.modal.catId),list=listForCategory(c),has=c.linkedList&&c.linkedList!=='none',label=c.linkedList==='employees'?'Employee':c.linkedList==='vendors'?'Vendor':'Doctor';return `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><h4>${escapeHtml(c.name)} <span style="color:var(--ink-soft);font-weight:400;font-size:13px">(${c.type})</span></h4><div class="field"><label>Amount</label><input type="number" min="0" id="amountInput" placeholder="0"></div>${has?`<div class="field"><label>${label}</label><select id="personSelect" onchange="document.getElementById('personOtherWrap').style.display=this.value==='${OTHER_VAL}'?'block':'none'"><option value="">— select —</option>${list.map(n=>`<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('')}<option value="${OTHER_VAL}">Other (not in list)</option></select></div><div class="field" id="personOtherWrap" style="display:none"><label>Type ${label.toLowerCase()} name</label><input type="text" id="personOtherInput"></div>`:''}<div class="field"><label>Remarks (optional)</label><input type="text" id="noteInput" placeholder="e.g. payment detail"></div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="submitEntry()">Add</button></div></div></div>`}
window.submitEntry=async function(){const c=catById(state.modal.catId),amt=document.getElementById('amountInput').value,note=document.getElementById('noteInput').value;if(!amt||Number(amt)<=0){showToast('Enter an amount first.',true);return}let person='';if(c.linkedList&&c.linkedList!=='none'){const sel=document.getElementById('personSelect').value;if(sel===OTHER_VAL){person=document.getElementById('personOtherInput').value.trim();if(!person){showToast('Type a name, or pick from the list.',true);return}}else if(!sel){showToast('Please select a '+(c.linkedList==='employees'?'employee':c.linkedList==='vendors'?'vendor':'doctor')+'.',true);return}else person=sel}try{await api('/api/entries','POST',{date:state.currentDate,catId:c.id,amount:amt,note,person});await loadDayData(state.currentDate);state.modal=null;render()}catch(e){showToast(e.message,true)}}
window.removeEntry=async function(id){try{await api('/api/entries/'+id+'?month='+monthKeyOf(state.currentDate),'DELETE');await loadDayData(state.currentDate);render()}catch(e){showToast(e.message,true)}}
window.loadEntryManager=async function(){const el=document.getElementById('entryManager');if(!el)return;el.innerHTML='<div class="loading">Loading entries…</div>';try{const q=new URLSearchParams({month:state.reportMonth,locationId:state.reportLocation,username:state.reportUser});const d=await api('/api/entries?'+q.toString());const rows=(d.entries||[]).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||Number(b.ts||0)-Number(a.ts||0));if(!rows.length){el.innerHTML='<div class="hint">No entries found for the selected filters.</div>';return}el.innerHTML=`<div class="hint" style="margin-bottom:8px">${rows.length} entries found. Deleting an entry is permanent, but Lab-Brain creates an automatic safety snapshot before the change.</div><div style="overflow:auto"><table><thead><tr><th>Date</th><th>Staff</th><th>Location</th><th>Category</th><th>Who / Vendor</th><th class="amt">Amount</th><th></th></tr></thead><tbody>${rows.map(e=>{const c=catById(e.catId);return `<tr><td>${fmtDate(e.date)}</td><td>${escapeHtml(e.name||e.username||'')}</td><td>${escapeHtml(locationName(e.locationId))}</td><td>${escapeHtml(c?.name||e.catId||'')}</td><td>${escapeHtml(e.person||'—')}</td><td class="amt">${c?.type==='income'?'+':'−'} ${money(e.amount)}</td><td><button class="del-btn" onclick="deleteManagedEntry('${escapeHtml(e.id)}','${escapeHtml(e.date)}')">Delete</button></td></tr>`}).join('')}</tbody></table></div>`}catch(e){console.error(e);el.innerHTML=`<div class="warning">Could not load entries. ${escapeHtml(e.message||'Please try again.')}</div>`}}
window.deleteManagedEntry=async function(id,date){if(!confirm('Delete this individual entry permanently? This removes only the selected entry. An automatic safety snapshot will be created before the change.'))return;try{await api('/api/entries/'+id+'?month='+monthKeyOf(date),'DELETE');showToast('Entry deleted.');await loadEverything();render();loadReportBody();setTimeout(loadEntryManager,100)}catch(e){showToast(e.message,true)}}
window.saveManualRefund=async function(){const amount=Number(document.getElementById('manualRefundInput').value||0);if(amount<0||!Number.isFinite(amount)){showToast('Enter a valid refund amount.',true);return}try{await api('/api/manual-refund','PUT',{date:state.currentDate,amount});state.manualRefund=amount;render();showToast('Manual Refund saved.')}catch(e){showToast(e.message,true)}};window.savePatients=async function(){const count=Number(document.getElementById('patientInput').value||0);if(count<0||!Number.isInteger(count)){showToast('Enter a valid whole patient count.',true);return}try{await api('/api/patients','PUT',{date:state.currentDate,count});await loadDayData(state.currentDate);render();showToast('Patient count saved.')}catch(e){showToast(e.message,true)}};window.saveOnline=async function(){const amount=Number(document.getElementById('onlineInput').value||0);try{await api('/api/online','PUT',{date:state.currentDate,amount});state.online=amount;render();showToast('Online amount saved.')}catch(e){showToast(e.message,true)}}
window.saveHandover=async function(){const short=Number(document.getElementById('shortInput').value||0),excess=Number(document.getElementById('excessInput').value||0),remark=document.getElementById('mismatchRemark').value.trim();if(short>0&&excess>0){showToast('Enter either Cash Short or Excess Cash, not both.',true);return}try{await api('/api/handover','POST',{date:state.currentDate,cashShort:short,excessCash:excess,remark});await loadDayData(state.currentDate);render();showToast('Handover saved.')}catch(e){showToast(e.message,true)}}
function renderReports(){return `<div class="card"><div class="filters"><strong style="margin-right:4px">Management Report</strong><input type="month" value="${state.reportMonth}" onchange="setReportMonth(this.value)">${state.user.role==='admin'?`<select onchange="setReportLocation(this.value)"><option value="all" ${state.reportLocation==='all'?'selected':''}>All locations</option>${state.locations.map(l=>`<option value="${l.id}" ${state.reportLocation===l.id?'selected':''}>${escapeHtml(l.name)}</option>`).join('')}</select><select onchange="setReportUser(this.value)"><option value="all" ${state.reportUser==='all'?'selected':''}>All staff</option>${state.staff.filter(u=>u.role==='staff'&&(state.reportLocation==='all'||u.locationId===state.reportLocation)).map(u=>`<option value="${escapeHtml(u.username)}" ${state.reportUser===u.username?'selected':''}>${escapeHtml(u.name)}</option>`).join('')}</select>`:''}<button class="btn secondary no-print" onclick="downloadReportCSV()">Excel (CSV)</button><button class="btn secondary no-print" onclick="printReport()">PDF / Print</button></div><div id="reportBody" class="loading">Loading management report…</div>${state.user.role==='admin'?`<div class="card no-print" style="margin-top:18px"><h3>Data Safety & Demo</h3><div class="hint" style="margin-bottom:10px">A downloadable backup is a complete copy of your Lab-Brain data. The system also keeps automatic snapshots before normal saves.</div><div class="row"><button class="btn secondary" onclick="downloadBackup()">Download Full Backup</button><button class="btn secondary" onclick="loadDemoData()">Load Demo Data</button><button class="btn danger" onclick="removeDemoData()">Remove Demo Data</button><button class="btn secondary" onclick="showBackups()">Backup History</button></div><div id="backupList" style="margin-top:12px"></div></div><div class="card no-print" style="margin-top:18px"><h3>Individual Entry Management</h3><div class="hint" style="margin-bottom:10px">Admin can review and permanently delete individual entries, including entries entered under another staff account. The selected Month, Branch and Staff filters above are used.</div><button class="btn secondary" onclick="loadEntryManager()">Show Entries</button><div id="entryManager" style="margin-top:12px"></div></div>`:''}</div>`}
window.setReportMonth=function(v){state.reportMonth=v;state.reportPanel='overview';state.reportRevenueCategory='all';render();loadReportBody()};window.setReportLocation=function(v){state.reportLocation=v;state.reportUser='all';state.reportPanel='overview';state.reportRevenueCategory='all';render();loadReportBody()};window.setReportUser=function(v){state.reportUser=v;state.reportPanel='overview';state.reportRevenueCategory='all';render();loadReportBody()};window.toggleReportPanel=function(v){state.reportPanel=state.reportPanel===v?'overview':v;if(v!=='revenue')state.reportRevenueCategory='all';loadReportBody()};window.setReportRevenueCategory=function(v){state.reportRevenueCategory=v;state.reportPanel='revenue';loadReportBody()}
function monthAdd(mk,delta){const [y,m]=mk.split('-').map(Number);const d=new Date(y,m-1+delta,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function dayCountInMonth(mk){const [y,m]=mk.split('-').map(Number);return new Date(y,m,0).getDate()}
function barSeries(values,max){return values.map(v=>`<div class="vbar-wrap"><div class="vbar-value">${escapeHtml(v.display)}</div><div class="vbar" style="height:${max?Math.max(4,(v.value/max)*100):4}%" title="${escapeHtml(v.label)}: ${escapeHtml(v.display)}"></div><div class="vbar-label">${escapeHtml(v.label)}</div></div>`).join('')}
async function loadReportBody(){const el=document.getElementById('reportBody');if(!el)return;el.innerHTML='<div class="loading">Loading management report…</div>';try{const from=state.reportMonth+'-01',to=state.reportMonth+'-'+String(dayCountInMonth(state.reportMonth)).padStart(2,'0');const q=new URLSearchParams({from,to,locationId:state.reportLocation,username:state.reportUser});const data=await api('/api/management-summary?'+q.toString());const s=summarize(data.entries),online=data.online.reduce((a,x)=>a+Number(x.amount||0),0),manualRefund=data.manualRefunds.reduce((a,x)=>a+Number(x.amount||0),0),expected=s.income-online-manualRefund-s.expense,short=data.handovers.reduce((a,h)=>a+Number(h.cashShort||0),0),excess=data.handovers.reduce((a,h)=>a+Number(h.excessCash||0),0),patients=data.patients.reduce((a,x)=>a+Number(x.count||0),0);const prevMk=monthAdd(state.reportMonth,-1),prevTo=state.reportMonth===monthKeyOf(todayStr())?Math.min(new Date().getDate(),dayCountInMonth(prevMk)):dayCountInMonth(prevMk);const prevData=await api('/api/management-summary?'+new URLSearchParams({from:prevMk+'-01',to:prevMk+'-'+String(prevTo).padStart(2,'0'),locationId:state.reportLocation,username:state.reportUser}));const prevRev=summarize(prevData.entries).income,prevExp=summarize(prevData.entries).expense,prevPatients=prevData.patients.reduce((a,x)=>a+Number(x.count||0),0);const pct=(cur,prev)=>prev?((cur-prev)/prev*100):null;const revPct=pct(s.income,prevRev),expPct=pct(s.expense,prevExp),patPct=pct(patients,prevPatients);const cards=[['revenue','Revenue',money(s.income),revPct],['expense','Cash Counter Expenses',money(s.expense),expPct],['patients','Patient Count',patients.toLocaleString('en-PK'),patPct]];let panel='';if(state.reportPanel!=='overview'){const current=state.reportPanel==='revenue'?data.entries.filter(e=>{const c=catById(e.catId);return c.type==='income'&&(state.reportRevenueCategory==='all'||e.catId===state.reportRevenueCategory)}):state.reportPanel==='expense'?data.entries.filter(e=>catById(e.catId).type==='expense'):[];if(state.reportPanel==='patients'){const byDay={};data.patients.forEach(x=>byDay[x.date]=(byDay[x.date]||0)+Number(x.count||0));const vals=Object.keys(byDay).sort().map(d=>({value:byDay[d],label:d.slice(8),display:String(byDay[d])}));panel=`<div class="analysis card"><div class="analysis-head"><div><h3>Daily Patient Count</h3><div class="hint">${fmtMonthLabel(state.reportMonth)}</div></div><button class="icon-btn" onclick="toggleReportPanel('patients')">Close</button></div><div class="vbars">${barSeries(vals,Math.max(1,...vals.map(x=>x.value)))||'<div class="hint">No patient data.</div>'}</div><div class="trend-actions"><button class="btn secondary" onclick="showTrend('patients',3)">Last 3 Completed Months</button><button class="btn secondary" onclick="showTrend('patients',6)">Last 6 Completed Months</button></div></div>`}else{const byDay={};const byCat={};current.forEach(e=>{byDay[e.date]=(byDay[e.date]||0)+Number(e.amount||0);const c=catById(e.catId);byCat[c.name]=(byCat[c.name]||0)+Number(e.amount||0)});const vals=Object.keys(byDay).sort().map(d=>({value:byDay[d],label:d.slice(8),display:money(byDay[d])}));const catVals=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([label,value])=>({value,label,display:money(value)}));const incomeCats=state.categories.filter(c=>c.type==='income');const catButtons=state.reportPanel==='revenue'?`<div class="category-switch"><button class="btn secondary ${state.reportRevenueCategory==='all'?'active':''}" onclick="setReportRevenueCategory('all')">All Revenue</button>${incomeCats.map(c=>`<button class="btn secondary ${state.reportRevenueCategory===c.id?'active':''}" onclick="setReportRevenueCategory('${escapeHtml(c.id)}')">${escapeHtml(c.name)}</button>`).join('')}</div>`:'';const selectedCat=state.reportPanel==='revenue'&&state.reportRevenueCategory!=='all'?catById(state.reportRevenueCategory).name:'';panel=`<div class="analysis card"><div class="analysis-head"><div><h3>${state.reportPanel==='revenue'?(selectedCat?'Daily Revenue — '+escapeHtml(selectedCat):'Daily Revenue'):'Daily Cash Counter Expenses'}</h3><div class="hint">${fmtMonthLabel(state.reportMonth)}</div></div><button class="icon-btn" onclick="toggleReportPanel('${state.reportPanel}')">Close</button></div>${catButtons}<div class="vbars">${barSeries(vals,Math.max(1,...vals.map(x=>x.value)))||'<div class="hint">No data.</div>'}</div>${state.reportPanel==='revenue'?`<div class="group-label" style="margin-top:18px">Revenue by category</div><div class="vbars small">${barSeries(catVals,Math.max(1,...catVals.map(x=>x.value)))||'<div class="hint">No data.</div>'}</div>`:`<div class="group-label" style="margin-top:18px">Expenses by category</div><div class="vbars small">${barSeries(catVals,Math.max(1,...catVals.map(x=>x.value)))||'<div class="hint">No data.</div>'}</div>`}<div class="trend-actions"><button class="btn secondary" onclick="showTrend('${state.reportPanel}',3)">Last 3 Completed Months</button><button class="btn secondary" onclick="showTrend('${state.reportPanel}',6)">Last 6 Completed Months</button></div></div>`}}el.innerHTML=`<h3>${fmtMonthLabel(state.reportMonth)}</h3><div class="kpi-grid report-cards">${cards.map(([key,label,value,change])=>`<button class="report-card ${key}" onclick="toggleReportPanel('${key}')"><div class="rc-label">${label}</div><div class="rc-value">${value}</div><div class="rc-change ${change!=null?(change>=0?'up':'down'):''}">${change==null?'No previous data':(change>=0?'↑ ':'↓ ')+Math.abs(change).toFixed(1)+'% vs previous comparable period'}</div><div class="rc-hint">Click to view analysis</div></button>`).join('')}</div><div class="kpi-grid" style="margin-top:10px"><div class="kpi"><div class="label">Online</div><div class="value">${money(online)}</div></div><div class="kpi"><div class="label">Manual Refund</div><div class="value neg">${money(manualRefund)}</div></div><div class="kpi"><div class="label">Expected Cash</div><div class="value">${money(expected)}</div></div><div class="kpi"><div class="label">Cash Short</div><div class="value neg">${money(short)}</div></div><div class="kpi"><div class="label">Excess Cash</div><div class="value pos">${money(excess)}</div></div></div>${panel}<div class="group-label" style="margin-top:22px">Location performance</div><table><thead><tr><th>Location</th><th class="amt">Revenue</th><th class="amt">Cash Expenses</th><th class="amt">Patients</th></tr></thead><tbody>${locationRows(data)}</tbody></table>${state.user.role==='admin'?`<div class="group-label" style="margin-top:22px">Staff performance</div><table><thead><tr><th>Staff</th><th>Location</th><th class="amt">Revenue</th><th class="amt">Cash Expenses</th><th class="amt">Patients</th></tr></thead><tbody>${staffReportRows(data)}</tbody></table>`:''}<div class="group-label" style="margin-top:22px">Cash mismatch / handover history</div><table><thead><tr><th>Date</th><th>Staff</th><th>Location</th><th class="amt">Expected</th><th class="amt">Short</th><th class="amt">Excess</th><th>Remarks</th></tr></thead><tbody>${handoverRows(data)}</tbody></table>`}catch(e){console.error(e);el.innerHTML=`<div class="warning">Report could not be loaded. ${escapeHtml(e.message||'Please refresh and try again.')}</div>`}}
function locationRows(data){const map={};data.entries.forEach(e=>{const id=e.locationId||'nmdc-main';map[id]=map[id]||{rev:0,exp:0,patients:0};const c=catById(e.catId);map[id][c.type==='income'?'rev':'exp']+=Number(e.amount||0)});data.patients.forEach(x=>{const id=x.locationId||'nmdc-main';map[id]=map[id]||{rev:0,exp:0,patients:0};map[id].patients+=Number(x.count||0)});return Object.entries(map).map(([id,x])=>`<tr><td>${escapeHtml(locationName(id))}</td><td class="amt pos">${money(x.rev)}</td><td class="amt neg">${money(x.exp)}</td><td class="amt">${x.patients.toLocaleString('en-PK')}</td></tr>`).join('')||'<tr class="muted-row"><td colspan="4">No location data.</td></tr>'}
function staffReportRows(data){const map={};data.entries.forEach(e=>{map[e.username]=map[e.username]||{name:e.name,locationId:e.locationId,rev:0,exp:0,patients:0};const c=catById(e.catId);map[e.username][c.type==='income'?'rev':'exp']+=Number(e.amount||0)});data.patients.forEach(x=>{map[x.username]=map[x.username]||{name:x.username,locationId:x.locationId,rev:0,exp:0,patients:0};map[x.username].patients+=Number(x.count||0)});return Object.values(map).map(x=>`<tr><td>${escapeHtml(x.name)}</td><td>${escapeHtml(locationName(x.locationId))}</td><td class="amt pos">${money(x.rev)}</td><td class="amt neg">${money(x.exp)}</td><td class="amt">${x.patients.toLocaleString('en-PK')}</td></tr>`).join('')||'<tr class="muted-row"><td colspan="5">No staff data.</td></tr>'}
function handoverRows(data){return data.handovers.sort((a,b)=>a.date.localeCompare(b.date)).map(h=>`<tr><td>${fmtDate(h.date)}</td><td>${escapeHtml(h.username)}</td><td>${escapeHtml(locationName(h.locationId))}</td><td class="amt">${money(h.calculated)}</td><td class="amt neg">${money(h.cashShort)}</td><td class="amt pos">${money(h.excessCash)}</td><td>${escapeHtml(h.remark||'')}</td></tr>`).join('')||'<tr class="muted-row"><td colspan="7">No handover records.</td></tr>'}
async function downloadFile(url,filename){const headers={};if(state.token)headers.Authorization='Bearer '+state.token;const r=await fetch(url,{headers});if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||'Download failed');}const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
window.downloadReportCSV=async function(){try{const from=state.reportMonth+'-01',to=state.reportMonth+'-'+String(dayCountInMonth(state.reportMonth)).padStart(2,'0');const q=new URLSearchParams({from,to,locationId:state.reportLocation,username:state.reportUser});await downloadFile('/api/report.csv?'+q.toString(),'lab-brain-report-'+state.reportMonth+'.csv');}catch(e){showToast(e.message,true)}};

window.showBackups=async function(){const el=document.getElementById('backupList');if(!el)return;try{const d=await api('/api/backups');if(!d.backups.length){el.innerHTML='<div class="hint">No automatic snapshots yet. A snapshot is created before the next normal data change.</div>';return}el.innerHTML='<div class="hint" style="margin-bottom:6px">Latest automatic snapshots (newest first):</div>'+d.backups.slice(0,10).map(b=>`<div class="row" style="justify-content:space-between;align-items:center;border-bottom:1px solid var(--line-soft);padding:6px 0"><span>Backup #${b.id} — ${new Date(b.created_at).toLocaleString()}</span><button class="icon-btn" onclick="restoreBackup(${b.id})">Restore</button></div>`).join('')}catch(e){el.innerHTML='<div class="warning">'+escapeHtml(e.message)+'</div>'}};
window.restoreBackup=async function(id){if(!confirm('Restore Backup #'+id+'? Your CURRENT data will first be snapshotted automatically, then this older version will become active.'))return;try{await api('/api/backups/'+id+'/restore','POST',{});localStorage.removeItem('labbrain_token');localStorage.removeItem('roznamcha_token');alert('Backup restored. Please log in again.');location.reload()}catch(e){showToast(e.message,true)}};
window.showTrend=async function(kind,n){const el=document.getElementById('reportBody');if(!el)return;el.innerHTML='<div class="loading">Loading trend…</div>';try{const currentMk=monthKeyOf(todayStr());const months=[];for(let i=n;i>=1;i--)months.push(monthAdd(currentMk,-i));const rows=await Promise.all(months.map(async mk=>{const d=await api('/api/management-summary?'+new URLSearchParams({from:mk+'-01',to:mk+'-'+String(dayCountInMonth(mk)).padStart(2,'0'),locationId:state.reportLocation,username:state.reportUser}));let v=0;if(kind==='patients')v=d.patients.reduce((a,x)=>a+Number(x.count||0),0);else if(kind==='revenue'&&state.reportRevenueCategory!=='all')v=d.entries.filter(e=>e.catId===state.reportRevenueCategory).reduce((a,e)=>a+Number(e.amount||0),0);else v=summarize(d.entries)[kind==='revenue'?'income':'expense'];return {value:v,label:fmtMonthLabel(mk),display:kind==='patients'?v.toLocaleString('en-PK'):money(v)};}));const max=Math.max(1,...rows.map(x=>x.value));const summaryRows=rows.map(r=>`<tr><td>${escapeHtml(r.label)}</td><td class="amt">${escapeHtml(r.display)}</td></tr>`).join('');el.innerHTML=`<div class="analysis card"><div class="analysis-head"><div><h3>${kind==='revenue'?'Revenue'+(state.reportRevenueCategory!=='all'?' — '+escapeHtml(catById(state.reportRevenueCategory).name):''):kind==='expense'?'Cash Counter Expenses':'Patient Count'} — Last ${n} Completed Months</h3><div class="hint">Current incomplete month is excluded.</div></div><button class="icon-btn" onclick="loadReportBody()">Back</button></div><div class="vbars trend-bars">${barSeries(rows,max)}</div><table class="trend-values"><thead><tr><th>Month</th><th class="amt">${kind==='patients'?'Patients':'Amount'}</th></tr></thead><tbody>${summaryRows}</tbody></table></div>`}catch(e){console.error(e);el.innerHTML=`<div class="warning">Trend could not be loaded. ${escapeHtml(e.message||'Please try again.')}</div>`}}
function renderSettings(){const a=state.user.role==='admin';const loc=state.selectedLocation==='all'?((state.locations[0]||{}).id||'nmdc-main'):state.selectedLocation;const cats=state.categories.filter(c=>(c.locationId||'nmdc-main')===loc);const catRows=cats.map(c=>{const i=state.categories.indexOf(c);return `<div class="settings-item"><input type="text" value="${escapeHtml(c.name)}" onchange="renameCategory(${i},this.value)"><select onchange="setCategoryType(${i},this.value)"><option value="income" ${c.type==='income'?'selected':''}>Income</option><option value="expense" ${c.type==='expense'?'selected':''}>Expense</option></select><select onchange="setCategoryLinkedList(${i},this.value)"><option value="none" ${c.linkedList==='none'?'selected':''}>No list</option><option value="employees" ${c.linkedList==='employees'?'selected':''}>Employees list</option><option value="vendors" ${c.linkedList==='vendors'?'selected':''}>Vendors list</option><option value="doctors" ${c.linkedList==='doctors'?'selected':''}>Doctors list</option></select><button class="icon-btn" onclick="removeCategory(${i})">Remove</button></div>`}).join('');const empRows=state.employees.map((e,i)=>`<div class="settings-item"><input type="text" value="${escapeHtml(e)}" onchange="renameEmployee(${i},this.value)"><button class="icon-btn" onclick="removeEmployee(${i})">Remove</button></div>`).join('')||'<div class="hint">No employees added.</div>';const vendRows=state.vendors.map((v,i)=>`<div class="settings-item"><input type="text" value="${escapeHtml(v)}" onchange="renameVendor(${i},this.value)"><button class="icon-btn" onclick="removeVendor(${i})">Remove</button></div>`).join('')||'<div class="hint">No vendors added.</div>';const docRows=state.doctors.map((v,i)=>`<div class="settings-item"><input type="text" value="${escapeHtml(v)}" onchange="renameDoctor(${i},this.value)"><button class="icon-btn" onclick="removeDoctor(${i})">Remove</button></div>`).join('')||'<div class="hint">No doctors added.</div>';const userRows=state.staff.map(u=>`<div class="settings-item"><span style="flex:1"><strong>${escapeHtml(u.name)}</strong> <span class="hint">(${escapeHtml(u.username)})</span></span><select onchange="setUserRole('${u.id}',this.value)"><option value="staff" ${u.role==='staff'?'selected':''}>Staff</option><option value="admin" ${u.role==='admin'?'selected':''}>Admin</option></select>${u.role==='staff'?`<select onchange="setUserLocation('${u.id}',this.value)"><option value="">Select location</option>${state.locations.map(l=>`<option value="${l.id}" ${u.locationId===l.id?'selected':''}>${escapeHtml(l.name)}</option>`).join('')}</select>`:'<span class="badge role-admin">All locations</span>'}<button class="icon-btn" onclick="resetUserPassword('${u.id}')">Reset password</button>${u.id!==state.user.id&&u.id!=='admin'?`<button class="icon-btn" onclick="removeUser('${u.id}')">Remove</button>`:''}</div>`).join('');if(!a)return `<div class="card"><h3>My account</h3><div class="hint">Location: ${escapeHtml(locationName(state.user.locationId))}</div>${passwordCard()}</div>`;return `<div class="row"><div class="col" style="flex:2;min-width:420px"><div class="card"><h3>Locations</h3><div class="settings-list">${state.locations.map((l,i)=>`<div class="settings-item"><input type="text" value="${escapeHtml(l.name)}" onchange="renameLocation(${i},this.value)"></div>`).join('')}</div></div><div class="card"><h3>Categories</h3><div class="field" style="max-width:430px;margin-bottom:12px"><label>Choose location</label><select onchange="setSettingsLocation(this.value)">${state.locations.map(l=>`<option value="${l.id}" ${loc===l.id?'selected':''}>${escapeHtml(l.name)}</option>`).join('')}</select></div><div class="hint" style="margin-bottom:10px">Categories are location-specific. Only linked categories use a person dropdown + Other.</div><div class="settings-list">${catRows}</div><div class="add-row"><input type="text" id="newCatName" placeholder="New category name" style="flex:1"><select id="newCatType"><option value="income">Income</option><option value="expense">Expense</option></select><button class="btn secondary" onclick="addCategory()">Add</button></div></div><div class="card"><h3>Staff & Owner accounts</h3><div class="settings-list">${userRows}</div><div class="add-row"><input type="text" id="newStaffName" placeholder="Full name"><input type="text" id="newStaffUser" placeholder="Username"><input type="text" id="newStaffPass" placeholder="Password"><select id="newStaffRole"><option value="staff">Staff</option><option value="admin">Admin / Owner</option></select><select id="newStaffLocation"><option value="">Staff location</option>${state.locations.map(l=>`<option value="${l.id}">${escapeHtml(l.name)}</option>`).join('')}</select><button class="btn secondary" onclick="addStaff()">Add</button></div></div>${passwordCard()}</div><div class="col" style="min-width:260px"><div class="card"><h3>Employees list</h3><div class="settings-list">${empRows}</div><div class="add-row"><input type="text" id="newEmpName" placeholder="Employee name" style="flex:1"><button class="btn secondary" onclick="addEmployee()">Add</button></div></div><div class="card"><h3>Doctors list</h3><div class="settings-list">${docRows}</div><div class="add-row"><input type="text" id="newDocName" placeholder="Doctor name" style="flex:1"><button class="btn secondary" onclick="addDoctor()">Add</button></div></div><div class="card"><h3>Vendors list</h3><div class="settings-list">${vendRows}</div><div class="add-row"><input type="text" id="newVendName" placeholder="Vendor name" style="flex:1"><button class="btn secondary" onclick="addVendor()">Add</button></div></div></div></div>`}

window.renameEmployee=(i,v)=>{state.employees[i]=v;cfgPut('/api/config/employees','employees',state.employees)};window.removeEmployee=i=>{state.employees.splice(i,1);cfgPut('/api/config/employees','employees',state.employees)};window.addEmployee=()=>{const n=document.getElementById('newEmpName').value.trim();if(n){state.employees.push(n);cfgPut('/api/config/employees','employees',state.employees)}};window.renameVendor=(i,v)=>{state.vendors[i]=v;cfgPut('/api/config/vendors','vendors',state.vendors)};window.removeVendor=i=>{state.vendors.splice(i,1);cfgPut('/api/config/vendors','vendors',state.vendors)};window.addVendor=()=>{const n=document.getElementById('newVendName').value.trim();if(n){state.vendors.push(n);cfgPut('/api/config/vendors','vendors',state.vendors)}};window.renameDoctor=(i,v)=>{state.doctors[i]=v;cfgPut('/api/config/doctors','doctors',state.doctors)};window.removeDoctor=i=>{state.doctors.splice(i,1);cfgPut('/api/config/doctors','doctors',state.doctors)};window.addDoctor=()=>{const n=document.getElementById('newDocName').value.trim();if(n){state.doctors.push(n);cfgPut('/api/config/doctors','doctors',state.doctors)}};
window.addStaff=async function(){const name=document.getElementById('newStaffName').value.trim(),username=document.getElementById('newStaffUser').value.trim(),password=document.getElementById('newStaffPass').value,role=document.getElementById('newStaffRole').value,locationId=document.getElementById('newStaffLocation').value;if(!name||!username||!password){showToast('Fill name, username and password.',true);return}if(role==='staff'&&!locationId){showToast('Select a location for Staff.',true);return}try{await api('/api/users','POST',{name,username,password,role,locationId});await loadConfig();render();showToast('Account created.')}catch(e){showToast(e.message,true)}};window.setUserRole=async(id,role)=>{try{await api('/api/users/'+id,'PUT',{role});await loadConfig();render()}catch(e){showToast(e.message,true)}};window.setUserLocation=async(id,locationId)=>{try{await api('/api/users/'+id,'PUT',{locationId});await loadConfig();render()}catch(e){showToast(e.message,true)}};window.resetUserPassword=async id=>{const pw=prompt('New password for this account:');if(!pw)return;try{await api('/api/users/'+id,'PUT',{password:pw});showToast('Password updated.')}catch(e){showToast(e.message,true)}};window.removeUser=async id=>{if(!confirm('Remove this account? Past entries stay in records.'))return;try{await api('/api/users/'+id,'DELETE');await loadConfig();render()}catch(e){showToast(e.message,true)}};window.changeMyPassword=async()=>{const oldPassword=document.getElementById('oldPass').value,newPassword=document.getElementById('newPass').value;try{await api('/api/change-password','POST',{oldPassword,newPassword});showToast('Password updated.');document.getElementById('oldPass').value='';document.getElementById('newPass').value=''}catch(e){showToast(e.message,true)}};
(async()=>{try{const ok=await tryResume();if(ok){state.loading=true;render();await loadEverything()}else{state.loading=false;render()}}catch(e){console.error('Startup failed:',e);state.token=null;state.user=null;localStorage.removeItem('labbrain_token');localStorage.removeItem('roznamcha_token');state.loading=false;state.loginError='Unable to load the previous session. Please log in again.';render()}})();
</script></body></html>
